function GameRecordScreen({ onBack, gameOrder, teamName, resumeData = null }) {
  const [activeView, setActiveView] = useState("record");
  const [screen, setScreen] = useState("main");
  const [history, setHistory] = useState([]);

  const gameMeta = {
    gameDate:   gameOrder?.gameDate   || new Date().toISOString().split("T")[0],
    gameType:   gameOrder?.gameType   || null,
    tournament: gameOrder?.tournament || null,
    season:     gameOrder?.gameDate   ? new Date(gameOrder.gameDate).getFullYear() : new Date().getFullYear(),
  };

  const batting = gameOrder?.batting ?? "先攻"; // 先攻=自チームが表で攻撃
  const myLineupRaw  = (gameOrder?.myLineup?.length > 0)
    ? gameOrder.myLineup.filter(r => r.player).map(r => ({ order:r.order, number:r.player.number, name:r.player.name, pos:r.pos||"-" }))
    : BATTERS_A;
  const oppLineupRaw = (gameOrder?.oppLineup?.length > 0) ? gameOrder.oppLineup : BATTERS_B;
  const myTeamNameRaw = teamName || TEAM_A;
  const oppTeamNameRaw = gameOrder?.oppTeamName || TEAM_B;
  // 先攻=自チームが表(A)、後攻=相手が表(A)（試合開始時の基本ラインナップ）
  const baseLineupA = batting === "後攻" ? oppLineupRaw : myLineupRaw;
  const baseLineupB = batting === "後攻" ? myLineupRaw  : oppLineupRaw;
  const activeTeamA  = batting === "後攻" ? oppTeamNameRaw : myTeamNameRaw;
  const oppTeamName  = batting === "後攻" ? myTeamNameRaw  : oppTeamNameRaw;
  // 表示・保存用: 常に自チームを参照
  const myScore  = batting === "後攻" ? scoreB : scoreA;
  const oppScore = batting === "後攻" ? scoreA : scoreB;

  const rd = resumeData;
  const [balls, setBalls] = useState(rd?.balls || 0);
  const [strikes, setStrikes] = useState(rd?.strikes || 0);
  const [outs, setOuts] = useState(rd?.outs || 0);
  const [inning, setInning] = useState(rd?.inning || 1);
  const [isTop, setIsTop] = useState(rd ? rd.isTop : true);
  const [batterIdxA, setBatterIdxA] = useState(rd?.batterIdxA || 0);
  const [batterIdxB, setBatterIdxB] = useState(rd?.batterIdxB ?? -1);
  const [runners, setRunners] = useState(() => migrateRunners(rd?.runners, rd?.runnerNames, rd?.runnerNumbers));
  const [pitchCount, setPitchCount] = useState(0);
  const [stateHistory, setStateHistory] = useState([]); // スナップショット履歴
  const [toast, setToast] = useState(null);
  const [alert, setAlert] = useState(null);
  const toastTimer = useRef(null);

  // 進塁確認フロー
  const [pendingResult, setPendingResult] = useState(null);
  const [runnerQueue, setRunnerQueue] = useState([]);
  const [currentRunnerIdx, setCurrentRunnerIdx] = useState(0);
  const [newRunners, setNewRunners] = useState({ ...RUNNERS_INIT });
  const [pendingBatterBase, setPendingBatterBase] = useState(null);
  const [pendingIsOut, setPendingIsOut] = useState(false);
  const [pendingRunnerOuts, setPendingRunnerOuts] = useState(0);
  const [selectedBase, setSelectedBase] = useState(null);

  // 試合終了モーダル
  const [showEndModal, setShowEndModal] = useState(false);
  const [endStep, setEndStep] = useState("menu"); // "menu" | "cold_reason" | "confirm" | "success"
  const [endType, setEndType] = useState(null);   // "completed" | "in_progress" | "cold"
  const [coldReason, setColdReason] = useState("");
  const [saving, setSaving] = useState(false);
  const [savedGameId, setSavedGameId] = useState(rd?.gameId || null);
  const [showOrderModal, setShowOrderModal] = useState(false);
  const [showSubModal,   setShowSubModal]   = useState(false);
  const [subStep,        setSubStep]        = useState(SUB_STEPS.TEAM);
  const [subTeam,        setSubTeam]        = useState("top"); // "top"=先攻, "bottom"=後攻
  const [subType,        setSubType]        = useState("守備交代");
  const [subOutSlot,     setSubOutSlot]     = useState(null);
  const [subInPlayer,    setSubInPlayer]    = useState(null);
  const [subNewPos,      setSubNewPos]      = useState(null);
  const [subSwapSlot1,   setSubSwapSlot1]   = useState(null);

  // 選手交代
  const [currentLineupA,  setCurrentLineupA]  = useState(rd?.currentLineupA  || null);
  const [currentLineupB,  setCurrentLineupB]  = useState(rd?.currentLineupB  || null);
  const startingLineupA = useRef([...baseLineupA]); // 試合開始時ラインナップ（意図的にイミュータブル）
  const startingLineupB = useRef([...baseLineupB]);
  const [substitutions,   setSubstitutions]   = useState(rd?.substitutions   || []);
  const [runnerPitchers,  setRunnerPitchers]  = useState(rd?.runnerPitchers  || { first: null, second: null, third: null });

  // 交代を反映した実効ラインナップ（null = 試合開始時の値をそのまま使用）
  const activeBattersA = currentLineupA ?? baseLineupA;
  const activeBattersB = currentLineupB ?? baseLineupB;
  const benchA = (batting === "後攻" ? gameOrder?.oppBench : gameOrder?.myBench) || [];
  const benchB = (batting === "後攻" ? gameOrder?.myBench  : gameOrder?.oppBench) || [];

  // ── gameLog：経過ビューと共有するデータ ──
  const pitcherB = activeBattersB.find(b => b.pos === "投") ?? activeBattersB[8] ?? PITCHER_B;
  const getPitcherNumber = (top) => top ? pitcherB.number : (activeBattersA.find(b => b.pos === "投")?.number ?? PITCHER_A.number);

  const setRunnersAll = (combined) => setRunners(combined);
  const clearRunners = () => setRunners({ ...RUNNERS_INIT });

  const initHalf = (inn, top, batters, idx) => ({
    inning: inn, topBottom: top ? "表" : "裏",
    atBats: [{ ...makeBat(batters[idx % LINEUP_SIZE], getPitcherNumber(top), { ...RUNNERS_INIT }) }],
  });

  const [gameLog, setGameLog] = useState(() =>
    rd?.gameLog?.length > 0 ? rd.gameLog : [initHalf(1, true, activeBattersA, 0)]
  );

  const scoreA = React.useMemo(() =>
    gameLog.filter(h => h.topBottom === "表").flatMap(h => h.atBats).reduce((s, ab) => s + (ab.runsScored || 0), 0),
    [gameLog]
  );
  const scoreB = React.useMemo(() =>
    gameLog.filter(h => h.topBottom === "裏").flatMap(h => h.atBats).reduce((s, ab) => s + (ab.runsScored || 0), 0),
    [gameLog]
  );

  // 現在のハーフイニングと打席へのアクセサ
  const currentHalfIdx = gameLog.length - 1;
  const currentHalf = gameLog[currentHalfIdx];
  const currentAtBatIdx = currentHalf.atBats.length - 1;
  const currentAtBat = currentHalf.atBats[currentAtBatIdx];

  const batters = isTop ? activeBattersA : activeBattersB;
  const batterIdx = isTop ? batterIdxA : batterIdxB;
  const setBatterIdx = isTop ? setBatterIdxA : setBatterIdxB;
  const pitcherA = activeBattersA.find(b => b.pos === "投") ?? PITCHER_A;
  const pitcher = isTop ? pitcherB : pitcherA;
  const batter = batters[batterIdx % LINEUP_SIZE];
  const next1 = batters[(batterIdx + 1) % LINEUP_SIZE];
  const next2 = batters[(batterIdx + 2) % LINEUP_SIZE];

  const showToast = (msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };
  const goTo = (s) => { setHistory(h => [...h, screen]); setScreen(s); };
  const goBack = () => {
    if (!history.length) return;
    setScreen(history[history.length - 1]);
    setHistory(h => h.slice(0, -1));
  };

  // gameLog更新ヘルパー
  const updateCurrentPitches = (updater) => {
    setGameLog(log => {
      const next = log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, pitches: updater(ab.pitches) })
      });
      return next;
    });
  };

  const addEvent = (event) => {
    setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
      ...h,
      atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, events: [...ab.events, event] })
    }));
  };

  const closeCurrentAtBat = (result, runnersAfter = null) => {
    setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
      ...h,
      atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : {
        ...ab, result,
        runnersAfter: runnersAfter ?? runners,
      })
    }));
  };

  const openNextAtBat = (newIsTop, newInning, newBatters, newIdx, runnersSnapshot) => {
    const top = newIsTop ?? isTop;
    const inn = newInning ?? inning;
    const bs = newBatters ?? batters;
    const idx = newIdx ?? ((batterIdx + 1) % LINEUP_SIZE);
    const player = bs[idx];
    const snap = runnersSnapshot ?? runners;

    setGameLog(log => {
      if (newIsTop !== undefined) {
        return [...log, initHalf(inn, top, bs, idx % LINEUP_SIZE)];
      }
      return log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: [...h.atBats, { ...makeBat(player, getPitcherNumber(top), { ...snap }) }]
      });
    });
  };

  const addScore = (n, scorerNumbers = []) => {
    if (n <= 0) return;
    const nums = scorerNumbers.filter(x => x != null);
    setGameLog(log => {
      const curA = log.filter(h => h.topBottom === "表").flatMap(h => h.atBats).reduce((s, ab) => s + (ab.runsScored || 0), 0);
      const curB = log.filter(h => h.topBottom === "裏").flatMap(h => h.atBats).reduce((s, ab) => s + (ab.runsScored || 0), 0);
      const nextA = isTop ? curA + n : curA;
      const nextB = isTop ? curB : curB + n;
      return log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : {
          ...ab, runsScored: (ab.runsScored||0) + n,
          runsScoredBy: [...(ab.runsScoredBy||[]), ...nums],
          scoreAfterA: nextA, scoreAfterB: nextB,
        })
      });
    });
  };

  const resetAtBat = () => { setBalls(0); setStrikes(0); };

  const nextAtBat = (newIsTop, newInning, newBatters) => {
    const newIdx = newIsTop !== undefined ? 0 : (batterIdx + 1) % LINEUP_SIZE;
    setBatterIdx(newIsTop !== undefined ? (i => i) : (i => i + 1));
    resetAtBat();
    openNextAtBat(newIsTop, newInning, newBatters, newIdx);
  };

  // advanceBatter=true: 打者がアウト（三振・ゴロ等）→ 次打者へ進む
  // advanceBatter=false: 走塁死・牽制アウト等、打者はアウトにならない → 現打者の打席継続
  const doOut = (runnersState, outTotal = outs + 1, advanceBatter = true) => {
    const no = outTotal;
    if (no >= OUTS_PER_HALF) {
      showToast("チェンジ！");
      setOuts(0);
      clearRunners();
      const newTop = !isTop;
      const newInn = !isTop ? inning + 1 : inning;
      if (!isTop) setInning(i => i + 1);
      setIsTop(newTop);
      const newBatters = newTop ? activeBattersA : activeBattersB;
      const inc = advanceBatter ? 1 : 0;
      const newIdx = newTop ? (batterIdxA + inc) % LINEUP_SIZE : (batterIdxB + inc) % LINEUP_SIZE;
      if (newTop) setBatterIdxA(newIdx); else setBatterIdxB(newIdx);
      setBalls(0); setStrikes(0);
      setGameLog(log => [...log, initHalf(newInn, newTop, newBatters, newIdx)]);
    } else {
      setOuts(no);
      if (runnersState) setRunners(runnersState);
      if (advanceBatter) {
        setBatterIdx(i => i + 1);
        resetAtBat();
        openNextAtBat(undefined, undefined, undefined, undefined, runnersState ?? runners);
      }
    }
  };

  // 選手を指定塁に配置し、前のランナーを詰める純粋関数。得点した選手番号を runsScored に返す
  const placePlayerAt = (r, base, playerName, playerNumber) => {
    const next = { first: r.first ?? null, second: r.second ?? null, third: r.third ?? null };
    const runsScored = [];
    if (base === 1) {
      if (next.first) {
        if (next.second) {
          if (next.third) { runsScored.push(next.third.number); next.third = next.second; }
          else { next.third = next.second; }
        }
        next.second = next.first;
      }
      next.first = { name: playerName, number: playerNumber };
    } else if (base === 2) {
      if (next.second) {
        if (next.third) { runsScored.push(next.third.number); next.third = next.second; }
        else { next.third = next.second; }
      }
      next.second = { name: playerName, number: playerNumber };
    } else if (base === 3) {
      if (next.third) runsScored.push(next.third.number);
      next.third = { name: playerName, number: playerNumber };
    }
    return { runners: next, runsScored };
  };

  const advanceWalk = (currentRunners) => {
    const r = currentRunners ?? runners;
    const { runners: next, runsScored } = placePlayerAt(r, 1, batter.name, batter.number);
    if (runsScored.length > 0) addScore(1, runsScored.filter(n => n != null));
    setRunners(next);
    return { runners: next };
  };

  const buildRunnerQueue = (r) => {
    const q = [];
    if (r.third)  q.push({ base:"third",  label:"3塁", baseNum:3, name: r.third.name,  number: r.third.number  });
    if (r.second) q.push({ base:"second", label:"2塁", baseNum:2, name: r.second.name, number: r.second.number });
    if (r.first)  q.push({ base:"first",  label:"1塁", baseNum:1, name: r.first.name,  number: r.first.number  });
    return q;
  };

  const startRunnerFlow = (result, isOut, batterBase) => {
    if (isOut && outs >= 2) {
      showToast(result.label);
      doOut(runners);
      setScreen("main"); setHistory([]);
      return;
    }
    const queue = buildRunnerQueue(runners);
    setPendingResult(result);
    setPendingBatterBase(batterBase);
    setPendingIsOut(isOut);
    setNewRunners({ ...RUNNERS_INIT });
    setPendingRunnerOuts(0);
    setCurrentRunnerIdx(0);
    setRunnerQueue(queue);
    if (queue.length === 0) {
      finishAtBat(isOut, batterBase, { ...RUNNERS_INIT });
      return;
    }
    if (isOut) { setScreen("askAdvance"); setHistory(h => [...h, "inplay"]); }
    else { setScreen("runnerAdvance"); setHistory(h => [...h, "inplay"]); }
  };

  const handleInplayResult = (result) => {
    // 特殊結果（死球・故意四球・振り逃げ）は専用ハンドラへ
    if (result.special === "DB")  { handlePitch("DB");  setScreen("main"); setHistory([]); return; }
    if (result.special === "IBB") { handlePitch("IBB"); setScreen("main"); setHistory([]); return; }
    if (result.special === "振")  { handlePitch("振");  return; } // 画面遷移はhandleWildStrike内で処理
    if (result.label.includes("本塁打") || result.label.includes("ホームラン")) {
      const sc = (runners.first?1:0)+(runners.second?1:0)+(runners.third?1:0)+1;
      const hrNums = [
        runners.third?.number, runners.second?.number, runners.first?.number, batter.number,
      ].filter(x => x != null);
      closeCurrentAtBat(result.label, { ...RUNNERS_INIT });
      addScore(sc, hrNums);
      clearRunners();
      showToast("ホームラン！");
      setBatterIdx(i => i + 1); resetAtBat();
      openNextAtBat(undefined, undefined, undefined, undefined, { ...RUNNERS_INIT });
      setScreen("main"); setHistory([]); return;
    }
    closeCurrentAtBat(result.label);
    if (result.dp) {
      // 併殺打：askAdvance をスキップして直接ランナー進塁確認へ
      const queue = buildRunnerQueue(runners);
      setPendingResult(result); setPendingBatterBase(null); setPendingIsOut(true);
      setNewRunners({ ...RUNNERS_INIT });
      setPendingRunnerOuts(0); setCurrentRunnerIdx(0); setRunnerQueue(queue);
      if (queue.length === 0) { finishAtBat(true, null, { ...RUNNERS_INIT }, { first: null, second: null, third: null }, 0, {}); }
      else { setScreen("runnerAdvance"); setHistory(h => [...h, "inplay"]); }
      return;
    }
    startRunnerFlow(result, result.type === "out", result.batterBase ?? null);
    setHistory(h => { const nh=[...h]; nh[nh.length-1]="inplay"; return nh; });
  };

  const handleAskAdvance = (yes) => {
    if (!yes) { finishAtBat(true, null, runners, 0); setScreen("main"); setHistory([]); }
    else setScreen("runnerAdvance");
  };

  const handleRunnerAdvance = (toBase) => {
    let score = 0;
    const next = { ...newRunners };
    const { name: runnerName, number: runnerNumber } = runnerQueue[currentRunnerIdx];
    const runnerOut = toBase === "out" ? 1 : 0;
    if (toBase === 4) { score = 1; }
    else if (toBase !== "out") {
      if (toBase === 1) { next.first  = { name: runnerName, number: runnerNumber }; }
      if (toBase === 2) { next.second = { name: runnerName, number: runnerNumber }; }
      if (toBase === 3) { next.third  = { name: runnerName, number: runnerNumber }; }
    }
    addScore(score, toBase === 4 && runnerNumber != null ? [runnerNumber] : []);
    const nextIdx = currentRunnerIdx + 1;
    const nextRunnerOuts = pendingRunnerOuts + runnerOut;
    if (nextIdx >= runnerQueue.length) {
      finishAtBat(pendingIsOut, pendingBatterBase, next, nextRunnerOuts);
      setScreen("main"); setHistory([]);
    } else {
      setNewRunners(next);
      setPendingRunnerOuts(nextRunnerOuts);
      setCurrentRunnerIdx(nextIdx);
    }
  };

  const finishAtBat = (isOut, batterBase, finalRunners, runnerOutCount = 0) => {
    if (isOut) {
      const totalOuts = outs + 1 + runnerOutCount;
      const dpLabel = runnerOutCount >= 2 ? "トリプルプレー！" : runnerOutCount === 1 ? "ゲッツー！" : (pendingResult?.label ?? "アウト");
      showToast(dpLabel);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: finalRunners })
      }));
      setRunners(finalRunners);
      doOut(finalRunners, totalOuts);
    } else {
      const { runners: next, runsScored } = batterBase
        ? placePlayerAt(finalRunners, batterBase, batter.name, batter.number)
        : { runners: finalRunners, runsScored: [] };
      if (runsScored.length > 0) addScore(runsScored.length, runsScored.filter(n => n != null));
      showToast(pendingResult?.label ?? "出塁");
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: next })
      }));
      setRunners(next);
      setBatterIdx(i => i + 1); resetAtBat();
      openNextAtBat(undefined, undefined, undefined, undefined, next);
    }
    setScreen("main");
    setHistory([]);
  };

  const handleWildStrike = () => {
    // 振り逃げ不成立: 1塁にランナーがいて2アウト未満
    if (runners.first && outs < 2) {
      closeCurrentAtBat("三振（KS）", runners);
      showToast("三振（KS）");
      doOut(runners);
      setScreen("main"); setHistory([]);
      return;
    }
    const queue = buildRunnerQueue(runners);
    setPendingResult({ label:"振り逃げ", type:"safe" });
    setPendingBatterBase(1); setPendingIsOut(false);
    setNewRunners({ ...RUNNERS_INIT }); setCurrentRunnerIdx(0); setRunnerQueue(queue);
    if (queue.length === 0) {
      handleWalk("振り逃げ");
      setScreen("main"); setHistory([]);
    } else {
      closeCurrentAtBat("振り逃げ");
      setScreen("runnerAdvance"); setHistory(["main"]); // 絶対指定でhistoryをリセット
    }
  };

  const openSubModal = () => {
    setSubStep(SUB_STEPS.TEAM); setSubTeam("top"); setSubType("守備交代");
    setSubOutSlot(null); setSubInPlayer(null); setSubNewPos(null); setSubSwapSlot1(null);
    setShowSubModal(true);
  };

  const applyDefenseSub = () => {
    saveSnapshot();
    const isA = subTeam === "top";
    const currentLineup = isA ? activeBattersA : activeBattersB;
    const outPlayer = currentLineup[subOutSlot];
    const newPos = subNewPos || subInPlayer.pos || "-";
    const newLineup = currentLineup.map((p, i) =>
      i === subOutSlot ? { ...p, number: subInPlayer.number, name: subInPlayer.name, pos: newPos } : p
    );
    if (isA) setCurrentLineupA(newLineup); else setCurrentLineupB(newLineup);
    setSubstitutions(s => [...s, {
      inning, isTop, slot: subOutSlot,
      type: newPos === "投" ? "投手交代" : "守備交代",
      outs, balls, strikes,
      outNumber: outPlayer.number, outName: outPlayer.name,
      inNumber: subInPlayer.number, inName: subInPlayer.name,
      runnersSnapshot: { ...runners },
    }]);
    showToast(`${subInPlayer.name}が出場`);
    setShowSubModal(false);
  };

  const applyPositionChange = () => {
    saveSnapshot();
    const isA = subTeam === "top";
    const currentLineup = isA ? activeBattersA : activeBattersB;
    const p1 = currentLineup[subOutSlot];
    const p2 = currentLineup[subSwapSlot1];
    const newLineup = currentLineup.map((p, i) => {
      if (i === subOutSlot)   return { ...p, pos: p2.pos };
      if (i === subSwapSlot1) return { ...p, pos: p1.pos };
      return p;
    });
    if (isA) setCurrentLineupA(newLineup); else setCurrentLineupB(newLineup);
    setSubstitutions(s => [...s, {
      inning, isTop, slot: null, type: "ポジションチェンジ",
      outs, balls, strikes,
      slot1: subOutSlot, slot2: subSwapSlot1,
      outNumber: p1.number, outName: p1.name,
      inNumber:  p2.number, inName:  p2.name,
      runnersSnapshot: null,
    }]);
    showToast("ポジションチェンジ");
    setShowSubModal(false);
  };

  const saveSnapshot = () => {
    setStateHistory(h => [...h, {
      balls, strikes, outs, inning, isTop,
      batterIdxA, batterIdxB,
      runners: { ...runners }, pitchCount,
      gameLog: JSON.parse(JSON.stringify(gameLog)),
      currentLineupA: currentLineupA ? [...currentLineupA] : null,
      currentLineupB: currentLineupB ? [...currentLineupB] : null,
      substitutions: [...substitutions],
      runnerPitchers: { ...runnerPitchers },
    }]);
  };

  // 試合保存
  const saveGame = async (status, opts = {}) => {
    setSaving(true);
    try {
      const payload = {
        team_name: myTeamNameRaw,
        opponent: oppTeamName,
        game_date: gameMeta.gameDate,
        season:    gameMeta.season,
        game_type: gameMeta.gameType,
        tournament: gameMeta.tournament || null,
        status,
        score_my: myScore,
        score_opp: oppScore,
        end_inning: opts.endInning ?? inning,
        end_reason: opts.reason || null,
        game_log: gameLog,
        game_state: status === "in_progress" ? {
          inning, isTop, balls, strikes, outs,
          runners, batterIdxA, batterIdxB, pitchCount,
          batting, lineup: activeBattersA,
          oppTeamName, oppLineup: activeBattersB, oppBench: gameOrder?.oppBench || [],
          currentLineupA, currentLineupB, substitutions, runnerPitchers,
          startingLineupA: startingLineupA.current, startingLineupB: startingLineupB.current,
        } : {
          batting, lineup: activeBattersA, oppTeamName, oppLineup: activeBattersB, oppBench: gameOrder?.oppBench || [],
          currentLineupA, currentLineupB, substitutions, runnerPitchers,
          startingLineupA: startingLineupA.current, startingLineupB: startingLineupB.current,
        },
      };
      let error;
      if (savedGameId) {
        ({ error } = await supabase.from("nsb_games").update(payload).eq("id", savedGameId));
      } else {
        const { data, error: insertError } = await supabase.from("nsb_games").insert(payload).select("id").single();
        error = insertError;
        if (!insertError && data?.id) setSavedGameId(data.id);
      }
      if (error) throw error;
      setEndStep("success");
    } catch (e) {
      setAlert("保存に失敗しました: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  const isEditMode = !!resumeData?.editMode;

  const stepBackInEditMode = () => {
    const newLog = JSON.parse(JSON.stringify(gameLog));
    // 結果のない空打席があれば除去
    let lastHalf = newLog[newLog.length - 1];
    const lastAb = lastHalf.atBats[lastHalf.atBats.length - 1];
    if (!lastAb.result && lastAb.pitches.length === 0) {
      lastHalf.atBats.pop();
      if (lastHalf.atBats.length === 0) {
        newLog.pop();
        if (newLog.length === 0) { showToast("これ以上戻れません"); return; }
        lastHalf = newLog[newLog.length - 1];
      }
    }
    const targetHalfIdx = newLog.length - 1;
    const targetAbIdx   = lastHalf.atBats.length - 1;
    const targetAb      = lastHalf.atBats[targetAbIdx];
    if (!targetAb?.result) { showToast("これ以上戻れません"); return; }

    // 同イニング内のアウト数（targetAb より前）
    let newOuts = 0;
    for (let ai = 0; ai < targetAbIdx; ai++) {
      const r = lastHalf.atBats[ai].result || "";
      if (isOutResult(r)) newOuts += r.includes("ゲッツー") ? 2 : 1;
    }
    // targetAb の開始時点のランナー状態を復元（旧フォーマット対応）
    // resultだけ消してpitchesは残す（1球単位で戻れるように）
    const keptPitches = targetAb.pitches || [];
    targetAb.result = null; targetAb.events = [];
    targetAb.runsScored = 0; targetAb.runsScoredBy = [];
    targetAb.scoreAfterA = null; targetAb.scoreAfterB = null;

    // 残ったpitchesからBSOを再計算
    const bso = replayBSO(keptPitches);

    const isTop = lastHalf.topBottom === "表";
    const lineup = isTop ? activeBattersA : activeBattersB;
    const abIdx  = lineup.findIndex(b => b.number === targetAb.number);

    setGameLog(newLog);
    setInning(lastHalf.inning);
    setIsTop(isTop);
    setOuts(newOuts);
    setRunners(migrateRunners(targetAb.runnersAtStart, targetAb.runnerNamesAtStart, targetAb.runnerNumbersAtStart));
    setBalls(bso.balls); setStrikes(bso.strikes);
    if (isTop) setBatterIdxA(abIdx !== -1 ? abIdx : 0);
    else       setBatterIdxB(abIdx !== -1 ? abIdx : 0);
    setStateHistory([]);
    setScreen("main"); setHistory([]);
    showToast("1打席戻しました");
  };

  // 1球取消（スナップショット巻き戻し）
  const handleUndo = () => {
    if (stateHistory.length === 0) {
      if (isEditMode) {
        const pitches = currentAtBat?.pitches || [];
        if (pitches.length > 0) {
          // 現打席のpitches末尾を1個削除してBSO再計算
          updateCurrentPitches(p => p.slice(0, -1));
          const bso = replayBSO(pitches.slice(0, -1));
          setBalls(bso.balls);
          setStrikes(bso.strikes);
          showToast("1球取消しました");
        } else {
          stepBackInEditMode();
        }
      }
      return;
    }
    const prev = stateHistory[stateHistory.length - 1];
    setBalls(prev.balls);
    setStrikes(prev.strikes);
    setOuts(prev.outs);
    setInning(prev.inning);
    setIsTop(prev.isTop);
    setBatterIdxA(prev.batterIdxA);
    setBatterIdxB(prev.batterIdxB);
    setRunners(prev.runners ?? { ...RUNNERS_INIT });
    setPitchCount(prev.pitchCount);
    setGameLog(prev.gameLog);
    setCurrentLineupA(prev.currentLineupA ?? null);
    setCurrentLineupB(prev.currentLineupB ?? null);
    setSubstitutions(prev.substitutions ?? []);
    setRunnerPitchers(prev.runnerPitchers ?? { first: null, second: null, third: null });
    setStateHistory(h => h.slice(0, -1));
    setScreen("main");
    setHistory([]);
    showToast("1球取消しました");
  };

  const handlePitch = (type) => {
    if (type !== "IP") saveSnapshot(); // IPはhandleInplayResultで保存
    setPitchCount(c => c + 1);
    updateCurrentPitches(p => [...p, type]);
    if (type === "B") {
      const nb = balls + 1;
      if (nb >= 4) { handleWalk("フォアボール"); } else setBalls(nb);
    } else if (type === "見逃" || type === "空振") {
      const ns = strikes + 1;
      if (ns >= 3) {
        const strikeoutLabel = type === "見逃" ? "三振（K）" : "三振（KS）";
        closeCurrentAtBat(strikeoutLabel, runners);
        showToast(strikeoutLabel);
        doOut(runners);
      } else setStrikes(ns);
    } else if (type === "振") {
      handleWildStrike();
    } else if (type === "F") {
      setStrikes(s => Math.min(s + 1, 2));
    } else if (type === "IP") {
      saveSnapshot(); // インプレー画面に入る前に保存
      goTo("inplay");
    } else if (type === "DB")  { handleWalk("デッドボール");
    } else if (type === "IBB") { handleWalk("故意四球");
    }
  };

  const handleWalk = (label) => {
    const { runners: next } = advanceWalk(runners);
    closeCurrentAtBat(label, next);
    showToast(label);
    setBatterIdx(i => i + 1); resetAtBat();
    openNextAtBat(undefined, undefined, undefined, undefined, next);
  };

  const handleBaseClick = (base) => { setSelectedBase(base); goTo("baseAction"); };

  const handleBaseAction = (action) => {
    const base = selectedBase;
    const nb = nextBase(base);
    if (action === "盗塁成功" && nb && runners[nb]) { setAlert("前にランナーがいます"); return; }
    saveSnapshot();
    const baseLabel = base === "first" ? "1塁" : base === "second" ? "2塁" : "3塁";
    if (action === "盗塁成功") {
      const stolen = runners[base];
      addEvent(`${baseLabel}ランナー #${stolen?.number ?? "?"} 盗塁成功`);
      const nextRunners = { ...runners, [base]: null };
      if (base === "first")       { nextRunners.second = stolen; }
      else if (base === "second") { nextRunners.third  = stolen; }
      else                        { addScore(1, stolen?.number != null ? [stolen.number] : []); }
      setRunners(nextRunners);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: nextRunners })
      }));
      showToast("盗塁成功");
    } else if (action === "盗塁死" || action === "牽制アウト") {
      addEvent(`${baseLabel}ランナー ${action}`);
      const nextRunners = { ...runners, [base]: null };
      setRunners(nextRunners);
      showToast(action);
      doOut(nextRunners, undefined, false);
    } else if (action === "牽制セーフ") {
      addEvent(`${baseLabel}ランナー 牽制セーフ`); showToast("牽制セーフ");
    } else if (action === "WP進塁" || action === "PB進塁") {
      const runner = runners[base];
      addEvent(`${baseLabel}ランナー #${runner?.number ?? "?"} ${action}`);
      const nextRunners = { ...runners, [base]: null };
      if (base === "first")       { nextRunners.second = runner; }
      else if (base === "second") { nextRunners.third  = runner; }
      else                        { addScore(1, runner?.number != null ? [runner.number] : []); }
      setRunners(nextRunners);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: nextRunners })
      }));
      showToast(action);
    }
    goBack();
  };

  const canGoBack = history.length > 0;
  const currentRunner = runnerQueue[currentRunnerIdx];

  // 現在の投手の投球数（gameLogから集計、pitchCount stateは全投手合算なので使わない）
  const currentPitcherPitchCount = React.useMemo(() =>
    gameLog.reduce((total, half) =>
      total + half.atBats.reduce((sum, ab) =>
        ab.pitcherNumber === pitcher.number ? sum + (ab.pitches?.length || 0) : sum, 0), 0),
    [gameLog, pitcher.number]);
  const advanceOptions = (baseNum) => {
    const opts = [];
    for (let b = baseNum; b <= 3; b++) {
      opts.push({ label: b === baseNum ? `${BASE_NAMES[b]}（進塁なし）` : BASE_NAMES[b], value: b });
    }
    opts.push({ label:"ホーム（得点）", value:4 });
    opts.push({ label:"アウト（走塁死）", value:"out" });
    return opts;
  };

  // 現在の打席の投球履歴（gameLogから取得）
  const currentPitches = currentAtBat?.pitches ?? [];

  return (
    <div style={{ display:"flex", justifyContent:"center", padding:"0 0 16px", background: C.bg, minHeight:"100vh" }}>
      <div style={{ background: C.bg, borderRadius:0, padding:0, width:"100%", position:"relative" }}>

        {/* アラート */}
        {alert && (
          <div style={{ position:"absolute", inset:0, zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.4)", borderRadius:24 }}>
            <div style={{ background:C.card, borderRadius:12, padding:"20px 24px", width:220, textAlign:"center" }}>
              <div style={{ fontSize:14, fontWeight:600, color:C.textPri, marginBottom:16 }}>{alert}</div>
              <Btn label="OK" bg={C.brandLight} border={C.brand} color={C.brand} onClick={() => setAlert(null)}/>
            </div>
          </div>
        )}

        {/* オーダー確認モーダル */}
        {showOrderModal && (

                        <div style={{ width:28, fontSize:11, color:C.textTer, flexShrink:0 }}>#{b.number}</div>

        {showSubModal && (

            activeTeamA={activeTeamA} oppTeamName={oppTeamName}

            subTeam={subTeam} setSubTeam={setSubTeam}
            subType={subType} setSubType={setSubType}
            subOutSlot={subOutSlot} setSubOutSlot={setSubOutSlot}
            subInPlayer={subInPlayer} setSubInPlayer={setSubInPlayer}

            subSwapSlot1={subSwapSlot1} setSubSwapSlot1={setSubSwapSlot1}

                <div onClick={() => { setEndType("completed"); setEndStep("confirm"); }}

                  <div>

                <div onClick={() => { setEndType("cold"); setColdReason(""); setEndStep("cold_reason"); }}

                  <span style={{ fontSize:26 }}>⚡</span>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color:"#B07800" }}>コールド / 早期終了</div>

              {endStep === "cold_reason" && (<>
                <div style={{ textAlign:"center", fontSize:16, fontWeight:700, color:C.textPri, marginBottom:6 }}>終了理由を選択</div>

                {["コールド", "時間切れ", "天候不良", "その他"].map(r => (

                    style={{
                      borderRadius:12, padding:"14px 16px", marginBottom:10, cursor:"pointer",
                      background: coldReason === r ? C.brandLight : C.bg,
                      border: `2px solid ${coldReason === r ? C.brand : C.divider}`,

                <div style={{ display:"flex", gap:12, marginTop:16 }}>
                  <div onClick={() => { setEndStep("menu"); setColdReason(""); }}
                    style={{ flex:1, borderRadius:12, padding:"13px", background:C.bg, border:`1px solid ${C.divider}`, textAlign:"center", cursor:"pointer", fontSize:14, color:C.textSec }}

                </div>
              </>)}

              {/* ── ③ 確認 ── */}
              {endStep === "confirm" && (<>
                <div style={{ textAlign:"center", fontSize:16, fontWeight:700, color:C.textPri, marginBottom:20 }}>
                  {endType === "completed" ? "試合終了" : endType === "cold" ? `コールド (${coldReason})` : "中断して保存"}

                <div style={{ background:C.bg, borderRadius:14, padding:"20px 16px", marginBottom:16, textAlign:"center" }}>

                  <div style={{ fontSize:36, fontWeight:900, color:C.brand, letterSpacing:"0.05em" }}>{scoreA} - {scoreB}</div>

                {endType === "in_progress" && (

        <div style={{ background: C.bg, borderRadius:0 }}>

            const nameStyle = (active) => ({
              display: "inline-block",
              color: C.scoreSubText, fontSize: 11, fontWeight: 600,
              borderBottom: active ? `2px solid ${C.scoreSubText}` : "2px solid transparent",

            return (
              <div style={{ background: C.scoreBg, padding:"12px 16px 14px" }}>

                    <div style={{ color:C.scoreText, fontSize: myBatting ? 36 : 28, fontWeight:800, lineHeight:1 }}>{myScore}</div>
                  </div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ color:C.scoreSubText, fontSize:12 }}>{inning}回 {isTop?"▲ 表":"▼ 裏"}</div>
                  </div>
                  <div style={{ textAlign:"right", opacity: oppBatting ? 1 : 0.4, transition:"opacity 0.2s", minWidth:80 }}>
                    <div style={{ ...nameStyle(oppBatting), display:"block", textAlign:"right" }}>
                      <span style={{ display:"inline-block", borderBottom: oppBatting ? `2px solid ${C.scoreSubText}` : "2px solid transparent", paddingBottom:1 }}>{oppTeamNameRaw}</span>
                    </div>
                    <div style={{ color:C.scoreText, fontSize: oppBatting ? 36 : 28, fontWeight:800, lineHeight:1 }}>{oppScore}</div>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* ── ゲーム内サブタブ ── */}
          <div style={{ display:"flex", background: C.card, borderBottom:`1px solid ${C.divider}` }}>
            {[
              { id:"record",  label:"記録",  Icon: PenLine },
              { id:"history", label:"経過",  Icon: ScrollText },
              { id:"stats",   label:"成績",  Icon: BarChart2 },
            ].map(t => (
              <div key={t.id} onClick={() => setActiveView(t.id)} style={{
                flex:1, display:"flex", flexDirection:"column", alignItems:"center",
                gap:2, padding:"8px 4px", cursor:"pointer", userSelect:"none",
                borderBottom: activeView===t.id ? `2px solid ${C.brand}` : "2px solid transparent",
              }}>
                <t.Icon size={16} color={activeView===t.id ? C.brand : C.textTer} strokeWidth={activeView===t.id ? 2.5 : 1.8}/>
                <span style={{ fontSize:10, fontWeight: activeView===t.id ? 700 : 400, color: activeView===t.id ? C.brand : C.textTer }}>{t.label}</span>
              </div>
            ))}
          </div>

          {/* 経過ビュー */}
          {activeView === "history" && <HistoryView gameLog={gameLog} teamNameA={activeTeamA} teamNameB={oppTeamName}/>}

          {/* 成績ビュー */}
          {activeView === "stats" && (
            <StatsView gameLog={gameLog} teamNameA={activeTeamA} teamNameB={oppTeamName}/>
          )}

          {activeView === "settings" && (
            <div style={{ padding:"24px 14px" }}>
              <div style={{ fontSize:13, fontWeight:700, color:C.textPri, marginBottom:16 }}>設定</div>
              <div style={{ padding:"12px 14px", background:C.bg, borderRadius:10, border:`1px solid ${C.divider}` }}>
                <div style={{ fontSize:11, color:C.textTer, marginBottom:4 }}>バージョン</div>
                <div style={{ fontSize:13, color:C.textPri }}>{APP_VERSION}</div>
              </div>
            </div>

          {/* 記録ビュー */}
          {activeView === "record" && <>

            {/* 戻るバー */}
            <div style={{ padding:"6px 14px", borderBottom:`1px solid ${C.divider}`, display:"flex", alignItems:"center", justifyContent:"space-between", minHeight:38 }}>

                <div

                  style={{ display:"flex", alignItems:"center", gap:2, padding:"4px 12px 4px 6px", borderRadius:20, background:C.card, border:`1px solid ${C.divider}`, cursor:"pointer", userSelect:"none", boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}
                >
                  <i className="ti ti-chevron-left" style={{ fontSize:16, color:C.textSec }} aria-hidden="true"/>
                  <span style={{ fontSize:13, color:C.textSec, fontWeight:500 }}>戻る</span>
                </div>
              ) : <div/>}
              {screen === "main" && (
                <div onClick={() => setShowOrderModal(true)}
                  style={{ fontSize:11, color:C.brand, fontWeight:600, cursor:"pointer", padding:"4px 10px", borderRadius:20, background:C.brandLight }}>
                  オーダー確認
                </div>
              )}

            {/* メイン画面 */}
            {screen === "main" && <>

              {/* 状況エリア */}
              <div style={{ padding:"12px 20px", display:"flex", alignItems:"center", gap:12, background: C.card, boxShadow: C.cardShadow, margin:"12px 16px 0", borderRadius:20 }}>

                  {[
                    { label:"B", count:balls,   max:3, color: C.bsoB },
                    { label:"S", count:strikes, max:2, color: C.bsoS },
                    { label:"O", count:outs,    max:2, color: C.bsoO },

                    <div key={r.label} style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <span style={{ width:12, fontSize:11, fontWeight:700, color: C.textSec }}>{r.label}</span>

                        {Array.from({length:r.max}).map((_,i) => <Dot key={i} filled={i<r.count} color={r.color}/>)}

                    </div>

                  <Diamond runners={runners} onBaseClick={handleBaseClick}/>

                  <div style={{ fontSize:10, color: C.textTer, marginBottom:2 }}>ピッチャー</div>
                  <div style={{ fontSize:13, fontWeight:700, color: C.textPri }}>#{pitcher.number} {pitcher.name}</div>
                  <div style={{ marginTop:4, display:"inline-block", padding:"2px 10px", background: C.brandLight, borderRadius:20, fontSize:11, fontWeight:600, color: C.brand }}>{currentPitcherPitchCount}球</div>
                </div>

              {/* 打者エリア */}
              <div style={{ padding:"12px 20px 0", margin:"12px 16px 0", background: C.card, borderRadius:20, boxShadow: C.cardShadow }}>

                  <span style={{ fontSize:11, fontWeight:700, color: C.brand, background: C.brandLight, padding:"2px 10px", borderRadius:20 }}>{batter.order}番</span>
                  <span style={{ fontSize:10, color: C.textTer }}>{batter.pos}　#{batter.number}</span>

                <div style={{ fontSize:22, fontWeight:800, color: C.textPri, lineHeight:1, marginBottom:10 }}>{batter.name}</div>

                  {currentPitches.length === 0
                    ? <span style={{ fontSize:11, color: C.textTer }}>投球なし</span>
                    : currentPitches.map((p,i) => <PitchChip key={i} type={p}/>)
                  }
                  {toast && (
                    <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background: C.brand, color: C.brandText, fontSize:13, fontWeight:600, pointerEvents:"none", borderRadius:12 }}>{toast}</div>
                  )}
                </div>
              </div>

              {/* 投球ボタン */}
              <div style={{ padding:"16px 20px 16px", margin:"12px 16px 0", background: C.card, borderRadius:20, boxShadow: C.cardShadow }}>

                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12 }}>
                  {[
                    { l:"-",  s:"ボール",   type:"B" },
                    { l:"○", s:"見逃しS",  type:"見逃" },
                    { l:"●", s:"空振りS",  type:"空振" },
                    { l:"v",  s:"ファウル", type:"F" },
                  ].map(b => (
                    <div key={b.l} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
                      <div

                        style={{ width:"100%", aspectRatio:"1", borderRadius:"50%", background:"#F5F7F5", border:"none", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:800, color: C.textPri, cursor:"pointer", userSelect:"none", boxShadow:"0 2px 8px rgba(0,0,0,0.08)", transition:"transform 0.08s, background 0.1s" }}
                        onPointerDown={e => { e.currentTarget.style.transform="scale(0.93)"; e.currentTarget.style.background=C.brandLight; }}
                        onPointerUp={e => { e.currentTarget.style.transform=""; e.currentTarget.style.background="#F5F7F5"; }}
                        onPointerLeave={e => { e.currentTarget.style.transform=""; e.currentTarget.style.background="#F5F7F5"; }}
                      >{b.l}</div>
                      <div style={{ fontSize:10, color: C.textSec, fontWeight:600, whiteSpace:"nowrap" }}>{b.s}</div>
                    </div>
                  ))}
                </div>

                  onPointerDown={e => { e.currentTarget.style.transform="scale(0.97)"; e.currentTarget.style.boxShadow="none"; }}
                  onPointerUp={e => { e.currentTarget.style.transform=""; e.currentTarget.style.boxShadow="0 4px 16px rgba(61,107,61,0.35)"; }}
                  onPointerLeave={e => { e.currentTarget.style.transform=""; e.currentTarget.style.boxShadow="0 4px 16px rgba(61,107,61,0.35)"; }}
                >
                  <span style={{ fontSize:15, fontWeight:800, color: C.brandText }}>打席結果を入力</span>

                  style={{
                    fontSize:11,

                    color: (stateHistory.length > 0 || isEditMode) ? C.textSec : C.textTer,
                    borderBottom: (stateHistory.length > 0 || isEditMode) ? `1px dashed ${C.textTer}` : "none",

                <span style={{ fontSize:11, color: C.textTer, cursor:"pointer" }}>特殊処理</span>
                <span style={{ width:1, height:10, background:C.divider }}/>
                <span
                  onClick={() => { setEndStep("menu"); setShowEndModal(true); }}
                  style={{ fontSize:11, color:"#C04040", cursor:"pointer", fontWeight:600, borderBottom:"1px solid rgba(192,64,64,0.35)" }}
                >記録を終了</span>
              </div>

              {/* スコアボード */}
              <div style={{ borderTop: `1px solid ${C.divider}`, padding: "0 14px" }}>
                <div style={{ display: "flex", borderBottom: `1px solid ${C.divider}` }}>
                  <div style={{ width: 64, fontSize: 10, color: C.textTer, padding: "5px 0", flexShrink: 0 }}>チーム</div>
                  {Array.from({ length: LINEUP_SIZE }).map((_, i) => (
                    <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10, color: i + 1 === inning ? C.brand : C.textTer, fontWeight: i + 1 === inning ? 700 : 400, padding: "5px 0" }}>{i + 1}</div>
                  ))}
                  <div style={{ width: 32, textAlign: "center", fontSize: 10, fontWeight: 700, color: C.textPri, padding: "5px 0", flexShrink: 0 }}>計</div>
                </div>
                {[
                  { name: activeTeamA, isTop: true,  score: scoreA },
                  { name: oppTeamName, isTop: false, score: scoreB },
                ].map(team => {
                  const inningScores = {};
                  gameLog.forEach(half => {
                    if ((half.topBottom === "表") !== team.isTop) return;

            {/* インプレー結果 */}

                <div style={{ fontSize:14, fontWeight:600, color:C.textPri }}>

            {/* バンク図タップ：走塁アクション */}
            {screen === "baseAction" && <>

                <div style={{ fontSize:14, fontWeight:600, color:C.textPri }}>

              <div style={{ display:"flex", flexDirection:"column", gap:7, padding:"12px 14px" }}>

                <Btn label="盗塁死"    bg="#F5EAEA" border="#8B2020" color="#8B2020" onClick={() => handleBaseAction("盗塁死")}/>

                <Btn label="牽制セーフ" bg="#F1EFE8" border="#9B9A94" color="#3A3A38" onClick={() => handleBaseAction("牽制セーフ")}/>
                <Btn label="牽制アウト" bg="#F5EAEA" border="#8B2020" color="#8B2020" onClick={() => handleBaseAction("牽制アウト")}/>
              </div>
            </>}

          </>}

        </div>
      </div>
    </div>
  );
}

// シーズン成績集計
// ─────────────────────────────
function calcSeasonStats(games) {
  const playerMap = {}; // number → stats

  games.forEach(game => {
    const myTopBottom = (game.game_state?.batting ?? "先攻") === "先攻" ? "表" : "裏";
    (game.game_log || []).forEach(half => {
      if (half.topBottom !== myTopBottom) return; // 自チームの攻撃のみ
      half.atBats.forEach(ab => {
        const num = ab.number;
        if (!playerMap[num]) {
          playerMap[num] = {
            number: num, name: ab.name, pos: ab.pos,
            pa: 0, atBats: 0, hits: 0, h1: 0, h2: 0, h3: 0, hr: 0,
            rbi: 0, run: 0, bb: 0, ibb: 0, hbp: 0, so: 0, sac: 0, sf: 0,
            tb: 0, sb: 0, risp_ab: 0, risp_hit: 0,
          };
        }
        const s = playerMap[num];
        const r = ab.result;
        if (!r) return;

        const isHit = ["ヒット","二塁打","三塁打","本塁打","1塁打","2塁打","3塁打","ホームラン"].some(h => r.includes(h));
        const isH2  = r.includes("二塁打") || r.includes("2塁打");
        const isH3  = r.includes("三塁打") || r.includes("3塁打");
        const isHR  = r.includes("本塁打") || r.includes("ホームラン");
        const isH1  = isHit && !isH2 && !isH3 && !isHR;
        const isSF  = r.includes("犠飛");
        const isSAC = r.includes("犠打") || r.includes("バント");
        const isIBB = r.includes("故意四球");
        const isBB  = r.includes("フォアボール") && !isIBB;
        const isAB  = !["フォアボール","故意四球","デッドボール","犠打","犠飛","バント"].some(x => r.includes(x));
        const isHBP = r.includes("デッドボール");

        s.pa++;
        if (isAB) s.atBats++;
        if (isHit) s.hits++;
        if (isH1) { s.h1++; s.tb += 1; }
        if (isH2) { s.h2++; s.tb += 2; }
        if (isH3) { s.h3++; s.tb += 3; }
        if (isHR) { s.hr++; s.tb += 4; }
        if (isBB)  s.bb++;
        if (isIBB) s.ibb++;
        if (isHBP) s.hbp++;
        if (isStrikeout(r)) s.so++;
        if (isSF)  s.sf++;
        if (isSAC) s.sac++;
        ab.events?.forEach(ev => { if (ev.includes("盗塁成功")) s.sb++; });

        const rs = ab.runnersAtStart || {};
        if (rs.second || rs.third) {
          s.risp_ab  += isAB ? 1 : 0;
          s.risp_hit += isHit ? 1 : 0;
        }

        const runs = ab.runsScored || 0;
        if (runs > 0) {
          const isDP = r.includes("ゲッツー");
          if (!isDP) {
            if ((isBB || isIBB || isHBP) && rs.first && rs.second && rs.third) s.rbi += 1;
            else if (!isBB && !isIBB && !isHBP) s.rbi += runs;
          }
        }
        // 得点者集計（runsScoredBy に背番号が記録されている場合）
        (ab.runsScoredBy || []).forEach(scorerNum => {
          if (playerMap[scorerNum]) playerMap[scorerNum].run = (playerMap[scorerNum].run || 0) + 1;
        });
      });
    });
  });

  return Object.values(playerMap);
}

// 打率/出塁率/長打率/wOBA計算ヘルパー
const sAvg  = (s) => s.atBats === 0 ? "-" : (s.hits / s.atBats).toFixed(3).replace("0.", ".");
const sOBP  = (s) => {
  const d = s.atBats + s.bb + s.ibb + s.hbp + s.sf;
  return d === 0 ? "-" : ((s.hits + s.bb + s.ibb + s.hbp) / d).toFixed(3).replace("0.", ".");
};
const sSLG  = (s) => s.atBats === 0 ? "-" : (s.tb / s.atBats).toFixed(3).replace("0.", ".");
const sOPS  = (s) => {
  const o = parseFloat(("0" + sOBP(s)).replace("-", "0"));
  const l = parseFloat(("0" + sSLG(s)).replace("-", "0"));
  return (o + l).toFixed(3).replace("0.", ".");
};
const sISO  = (s) => s.atBats === 0 ? "-" : ((s.tb - s.hits) / s.atBats).toFixed(3).replace("0.", ".");
const sWOBA = (s) => {
  const denom = s.pa - s.ibb - s.sac;
  if (denom <= 0) return "-";
  const v = (0.69*s.bb + 0.72*s.hbp + 0.88*s.h1 + 1.26*s.h2 + 1.60*s.h3 + 2.07*s.hr) / denom;
  return v.toFixed(3).replace("0.", ".");
};
const sBBK  = (s) => s.so === 0 ? "-" : (s.bb / s.so).toFixed(2);
const sRISP = (s) => s.risp_ab === 0 ? "-" : (s.risp_hit / s.risp_ab).toFixed(3).replace("0.", ".");

function SeasonStatsTab({ team }) {
  const [games, setGames] = useState([]);

  const [typeFilter, setTypeFilter] = useState("all");
  const [selectedPlayer, setSelectedPlayer] = useState(null);

  useEffect(() => {
    if (!team) return;
    supabase
      .from("nsb_games")
      .select("id, game_date, opponent, score_my, score_opp, status, season, game_type, game_log")
      .eq("team_name", team.name)
      .order("game_date", { ascending: false })
      .then(({ data }) => { setGames(data || []); setLoading(false); });
  }, [team]);

  const filtered = games.filter(g => {
    if (typeFilter !== "all" && g.game_type !== typeFilter) return false;
    return true;
  });

  const seasonStats = React.useMemo(() => calcSeasonStats(filtered), [filtered]);

  // 選手クリック時の試合別成績
  const playerGames = React.useMemo(() => {
    if (!selectedPlayer) return [];
    return filtered.map(game => {
      const atBats = [];
      (game.game_log || []).forEach(half => {
        if (half.topBottom !== "表") return;
        half.atBats.forEach(ab => { if (ab.number === selectedPlayer.number) atBats.push({ ...ab, half }); });
      });
      if (atBats.length === 0) return null;
      // 1試合分の小計
      const ab = atBats.filter(ab => {
        const r = ab.result || "";
        return !["フォアボール","故意四球","デッドボール","犠打","犠飛","バント"].some(x => r.includes(x));
      }).length;
      const h = atBats.filter(ab => {
        const r = ab.result || "";
        return ["ヒット","二塁打","三塁打","本塁打","1塁打","2塁打","3塁打","ホームラン"].some(x => r.includes(x));
      }).length;
      const rbi = atBats.reduce((sum, ab) => {
        const r = ab.result || "";
        const runs = ab.runsScored || 0;
        if (runs === 0) return sum;
        if (r.includes("ゲッツー")) return sum;
        const isBBH = r.includes("フォアボール") || r.includes("故意四球") || r.includes("デッドボール");
        const rs = ab.runnersAtStart || {};
        if (isBBH && rs.first && rs.second && rs.third) return sum + 1;
        if (!isBBH) return sum + runs;
        return sum;
      }, 0);
      const hr = atBats.filter(ab => { const r = ab.result||""; return r.includes("本塁打")||r.includes("ホームラン"); }).length;
      return { game, pa: atBats.length, atBats: ab, hits: h, rbi, hr };
    }).filter(Boolean);
  }, [selectedPlayer, filtered]);

  const StatCell = ({ v, hi }) => (
    <div style={{ width: 36, textAlign: "center", fontSize: 12, flexShrink: 0, color: hi && v > 0 ? C.brand : C.textPri, fontWeight: hi && v > 0 ? 700 : 400 }}>{v}</div>
  );

  const fmtDate = (d) => { if (!d) return ""; const dt = new Date(d); return `${dt.getMonth()+1}/${dt.getDate()}`; };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      {/* ヘッダー */}
      <div style={{ background: C.scoreBg, padding: "16px 16px 12px", flexShrink: 0 }}>
        <div style={{ fontSize: 16, fontWeight: 800, color: C.scoreText, marginBottom: 8 }}>シーズン成績</div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
          {[["all","すべて"],["公式戦","公式戦"],["練習試合","練習試合"]].map(([v, label]) => (
            <div key={v} onClick={() => setTypeFilter(v)}
              style={{ fontSize: 11, padding: "4px 10px", borderRadius: 20, cursor: "pointer", fontWeight: typeFilter === v ? 700 : 400,
                background: typeFilter === v ? "rgba(255,255,255,0.25)" : "transparent",
                color: typeFilter === v ? C.scoreText : C.scoreSubText, border: `1px solid ${typeFilter === v ? "rgba(255,255,255,0.5)" : "transparent"}` }}>
              {label}
            </div>
          ))}
          <div style={{ marginLeft: "auto", fontSize: 11, color: C.scoreSubText }}>{filtered.length}試合</div>
        </div>
      </div>

      {loading ? (
        <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color: C.textTer, fontSize:13 }}>読み込み中...</div>
      ) : seasonStats.length === 0 ? (
        <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:8 }}>
          <div style={{ fontSize: 13, color: C.textTer }}>試合記録がありません</div>
        </div>
      ) : (
        <div style={{ flex: 1, overflowY: "auto" }}>
          {/* 表示切替 */}
          <div style={{ display:"flex", justifyContent:"flex-end", padding:"8px 16px 4px" }}>
            <div onClick={() => setCompact(!compact)}
              style={{ fontSize: 11, color: C.brand, fontWeight: 600, cursor: "pointer", padding:"4px 10px", borderRadius:20, background: C.brandLight }}>
              {compact ? "詳細表示" : "コンパクト"}
            </div>
          </div>

          {/* ヘッダー行 */}
          <div style={{ display:"flex", padding:"4px 16px 4px 12px", borderBottom:`1px solid ${C.divider}`, background: C.card }}>
            <div style={{ width: 80, fontSize: 10, color: C.textTer, flexShrink: 0 }}>選手</div>
            {compact ? (
              <>
                <div style={{ width:36, textAlign:"center", fontSize:10, color:C.textTer, flexShrink:0 }}>打率</div>
                <div style={{ width:36, textAlign:"center", fontSize:10, color:C.textTer, flexShrink:0 }}>出塁</div>
                <div style={{ width:36, textAlign:"center", fontSize:10, color:C.textTer, flexShrink:0 }}>長打</div>
                <div style={{ width:36, textAlign:"center", fontSize:10, color:C.brand, flexShrink:0, fontWeight:700 }}>OPS</div>
                <div style={{ width:36, textAlign:"center", fontSize:10, color:C.textTer, flexShrink:0 }}>wOBA</div>
              </>
            ) : (
              <>
                {["打席","打数","安打","二塁","三塁","本塁","打点","得点","四球","三振","盗塁","長打","得点圏","打率","出塁","OPS","ISO"].map(h => (
                  <div key={h} style={{ width:36, textAlign:"center", fontSize:10, color: h==="OPS"?C.brand:C.textTer, flexShrink:0, fontWeight: h==="OPS"?700:400 }}>{h}</div>
                ))}
              </>
            )}
          </div>

          {/* 選手行 */}
          {seasonStats.map((s, i) => (
            <div key={s.number} onClick={() => setSelectedPlayer(s)}
              style={{ display:"flex", alignItems:"center", padding:"10px 16px 10px 12px",
                borderBottom:`1px solid ${C.divider}`, background: i%2===0 ? C.card : C.bg, cursor:"pointer" }}
              onPointerDown={e => e.currentTarget.style.opacity="0.7"}
              onPointerUp={e => e.currentTarget.style.opacity="1"}
              onPointerLeave={e => e.currentTarget.style.opacity="1"}
            >
              <div style={{ width: 80, flexShrink: 0 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.textPri }}>{s.name}</div>
                <div style={{ fontSize: 10, color: C.textTer }}>#{s.number}</div>
              </div>
              {compact ? (
                <>
                  <div style={{ width:36, textAlign:"center", fontSize:13, fontWeight:700, color:C.textPri, flexShrink:0 }}>{sAvg(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:12, color:C.textSec, flexShrink:0 }}>{sOBP(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:12, color:C.textSec, flexShrink:0 }}>{sSLG(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:13, fontWeight:700, color:C.brand, flexShrink:0 }}>{sOPS(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:12, color:C.textSec, flexShrink:0 }}>{sWOBA(s)}</div>
                </>
              ) : (
                <>
                  {[s.pa, s.atBats, s.hits, s.h2, s.h3, s.hr, s.rbi, s.run, s.bb, s.so, s.sb, s.tb].map((v, vi) => (
                    <StatCell key={vi} v={v} hi={[5,6,7,10].includes(vi)}/>
                  ))}
                  <div style={{ width:36, textAlign:"center", fontSize:11, color: s.risp_ab>0?C.brand:C.textTer, flexShrink:0 }}>{sRISP(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:11, color:C.textPri, flexShrink:0 }}>{sAvg(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:11, color:C.textSec, flexShrink:0 }}>{sOBP(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:12, fontWeight:700, color:C.brand, flexShrink:0 }}>{sOPS(s)}</div>
                  <div style={{ width:36, textAlign:"center", fontSize:11, color:C.textSec, flexShrink:0 }}>{sISO(s)}</div>
                </>
              )}
            </div>
          ))}
        </div>
      )}

      {/* 選手別試合詳細モーダル */}
      {selectedPlayer && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:300, display:"flex", alignItems:"flex-end", justifyContent:"center" }}
          onClick={() => setSelectedPlayer(null)}>
          <div onClick={e => e.stopPropagation()}
            style={{ background: C.card, borderRadius:"20px 20px 0 0", width:"100%", maxWidth:480, maxHeight:"80vh", display:"flex", flexDirection:"column" }}>
            {/* モーダルヘッダー */}
            <div style={{ padding:"16px 20px 12px", borderBottom:`1px solid ${C.divider}`, flexShrink:0 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:16, fontWeight:800, color:C.textPri }}>{selectedPlayer.name}</div>
                  <div style={{ fontSize:11, color:C.textTer }}>#{selectedPlayer.number} · {selectedPlayer.pos}</div>
                </div>
                <div onClick={() => setSelectedPlayer(null)}
                  style={{ width:28, height:28, borderRadius:"50%", background:C.bg, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
                  <X size={16} color={C.textSec}/>
                </div>
              </div>
              {/* 通算サマリー */}
              <div style={{ display:"flex", gap:12, marginTop:10 }}>
                {[["打率",sAvg(selectedPlayer)],["出塁",sOBP(selectedPlayer)],["OPS",sOPS(selectedPlayer)],["本塁打",selectedPlayer.hr],["打点",selectedPlayer.rbi]].map(([l,v]) => (
                  <div key={l} style={{ textAlign:"center" }}>
                    <div style={{ fontSize:14, fontWeight:800, color: l==="OPS"?C.brand:C.textPri }}>{v}</div>
                    <div style={{ fontSize:9, color:C.textTer }}>{l}</div>
                  </div>
                ))}
              </div>
            </div>
            {/* 試合別成績リスト */}
            <div style={{ overflowY:"auto", flex:1 }}>
              <div style={{ display:"flex", padding:"6px 16px", background:C.bg, fontSize:10, color:C.textTer, gap:0 }}>
                <div style={{ width:44, flexShrink:0 }}>日付</div>
                <div style={{ flex:1 }}>相手</div>
                <div style={{ width:28, textAlign:"center", flexShrink:0 }}>打席</div>
                <div style={{ width:28, textAlign:"center", flexShrink:0 }}>打数</div>
                <div style={{ width:28, textAlign:"center", flexShrink:0 }}>安打</div>
                <div style={{ width:28, textAlign:"center", flexShrink:0 }}>打点</div>
                <div style={{ width:28, textAlign:"center", flexShrink:0 }}>HR</div>
              </div>
              {playerGames.map((pg, i) => (
                <div key={pg.game.id} style={{ display:"flex", alignItems:"center", padding:"11px 16px",
                  borderBottom:`1px solid ${C.divider}`, background: i%2===0?C.card:C.bg }}>
                  <div style={{ width:44, fontSize:11, color:C.textTer, flexShrink:0 }}>{fmtDate(pg.game.game_date)}</div>
                  <div style={{ flex:1, fontSize:13, fontWeight:600, color:C.textPri }}>vs {pg.game.opponent}</div>
                  {[pg.pa, pg.atBats, pg.hits, pg.rbi, pg.hr].map((v, vi) => (
                    <div key={vi} style={{ width:28, textAlign:"center", fontSize:13, flexShrink:0,
                      color: vi===2&&v>0?C.brand : vi===4&&v>0?"#C45000":C.textPri,
                      fontWeight: (vi===2&&v>0)||(vi===4&&v>0)?700:400 }}>{v}</div>
                  ))}
                </div>
              ))}
              {playerGames.length === 0 && (
                <div style={{ padding:24, textAlign:"center", fontSize:13, color:C.textTer }}>出場記録なし</div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TeamSetupScreen({ onComplete }) {
  const [teamName, setTeamName] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const handleSave = async () => {
    if (!teamName.trim()) { setError("チーム名を入力してください"); return; }
    setSaving(true);
    const { data, error } = await supabase
      .from("nsb_teams")
      .insert({ name: teamName.trim(), password_hash: "none" })
      .select()
      .single();
    if (error) { setError("保存に失敗しました"); setSaving(false); return; }
    onComplete(data);
  };

  return (
    <div style={{ background: C.bg, minHeight:"100vh", width:"100%", display:"flex", flexDirection:"column", justifyContent:"center", padding:"32px 20px", fontFamily:"'Noto Sans JP', sans-serif" }}>
      <div style={{ fontSize:9, color: C.textTer, letterSpacing:"0.15em", marginBottom:8 }}>NEO SCORE BOOK</div>
      <div style={{ fontSize:24, fontWeight:800, color: C.textPri, marginBottom:4 }}>チームを登録する</div>
      <div style={{ fontSize:13, color: C.textSec, marginBottom:32 }}>最初にチーム名を設定してください</div>

      <div style={{ background: C.card, borderRadius:16, padding:"16px", boxShadow: C.cardShadow, marginBottom:16 }}>
        <div style={{ fontSize:10, fontWeight:700, color: C.textTer, letterSpacing:"0.08em", marginBottom:8 }}>チーム名</div>
        <input
          type="text"
          placeholder="例：兵庫ライオンズ"
          value={teamName}
          onChange={e => { setTeamName(e.target.value); setError(""); }}
          style={{ width:"100%", border:"none", outline:"none", fontSize:18, fontWeight:700, color: C.textPri, background:"transparent", fontFamily:"inherit" }}
        />
        {error && <div style={{ fontSize:11, color:"#8B2020", marginTop:6 }}>{error}</div>}
      </div>

      <div
        onClick={handleSave}
        style={{ padding:"16px", borderRadius:50, background: saving ? C.textSec : C.brand, textAlign:"center", fontSize:15, fontWeight:800, color: C.brandText, cursor: saving ? "default" : "pointer", boxShadow:"0 4px 16px rgba(61,107,61,0.35)" }}
        onPointerDown={e => !saving && (e.currentTarget.style.opacity="0.8")}
        onPointerUp={e => e.currentTarget.style.opacity="1"}
        onPointerLeave={e => e.currentTarget.style.opacity="1"}
      >
        {saving ? "保存中..." : "登録して始める"}
      </div>
    </div>
  );
}

function SettingsScreen({ team, onUpdate }) {
  const [teamName, setTeamName] = useState(team.name);
  const [saved, setSaved] = useState(false);

  const handleSave = async () => {
    await supabase.from("nsb_teams").update({ name: teamName }).eq("id", team.id);
    onUpdate({ ...team, name: teamName });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ background: C.bg, minHeight:"100vh", width:"100%", fontFamily:"'Noto Sans JP', sans-serif" }}>
      <div style={{ background: C.card, padding:"16px 20px", boxShadow:"0 1px 0 #F0F0F0", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <div style={{ fontSize:18, fontWeight:800, color: C.textPri }}>設定</div>
        <span style={{ fontSize:9, color:C.textTer }}>{APP_VERSION}</span>
      </div>

      <div style={{ padding:"0 16px", display:"flex", flexDirection:"column", gap:12 }}>
        {/* チーム名 */}
        <div style={{ background: C.card, borderRadius:16, padding:"14px 16px", boxShadow: C.cardShadow }}>
          <div style={{ fontSize:10, fontWeight:700, color: C.textTer, letterSpacing:"0.08em", marginBottom:8 }}>チーム名</div>
          <input
            type="text"
            value={teamName}
            onChange={e => setTeamName(e.target.value)}
            style={{ width:"100%", border:"none", outline:"none", fontSize:16, fontWeight:700, color: C.textPri, background:"transparent", fontFamily:"inherit" }}
          />
        </div>

        <div
          onClick={handleSave}
          style={{ padding:"14px", borderRadius:50, background: saved ? C.textSec : C.brand, textAlign:"center", fontSize:14, fontWeight:800, color: C.brandText, cursor:"pointer", boxShadow:"0 4px 16px rgba(61,107,61,0.35)", transition:"background 0.2s" }}
          onPointerDown={e => e.currentTarget.style.opacity="0.8"}
          onPointerUp={e => e.currentTarget.style.opacity="1"}
          onPointerLeave={e => e.currentTarget.style.opacity="1"}
        >
          {saved ? "保存しました ✓" : "保存する"}
        </div>

        <div style={{ padding:"12px 0", textAlign:"center", fontSize:11, color: C.textTer }}>
          neo score book v0.1.0
        </div>
      </div>
    </div>
  );
}

function NeoScoreBookApp() {
  const [activeTab, setActiveTab] = useState("games");
  const [screen, setScreen] = useState("home");
  const [team, setTeam] = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [gameOrder, setGameOrder] = useState(null);
  const [resumeData, setResumeData] = useState(null);
  const [leaveGameConfirm, setLeaveGameConfirm] = useState(null); // null | tabId

  // 起動時にチーム情報を取得
  useEffect(() => {
    loadTeam();
  }, []);

  const loadGameData = async (gameId) => {
    const { data } = await supabase
      .from("nsb_games")
      .select("id, game_state, game_log, game_date, game_type, tournament, opponent, score_my, score_opp")
      .eq("id", gameId).single();
    if (!data) return null;
    const gs = data.game_state || {};
    const batting = gs.batting || "先攻";
    const scoreA = batting === "先攻" ? (data.score_my || 0) : (data.score_opp || 0);
    const scoreB = batting === "先攻" ? (data.score_opp || 0) : (data.score_my || 0);
    const myLineup = (batting === "先攻" ? (gs.lineup || []) : (gs.oppLineup || []))
      .map((p, i) => ({ order: p.order || i+1, player: { number: p.number, name: p.name }, pos: p.pos || "-" }));
    const order = {
      batting, myLineup,
      oppLineup: batting === "先攻" ? (gs.oppLineup || []) : (gs.lineup || []),
      oppTeamName: data.opponent || "",
      gameDate: data.game_date, gameType: data.game_type, tournament: data.tournament,
    };
    return { data, gs, batting, scoreA, scoreB, order, log: data.game_log || [] };
  };

  const handleEdit = async (gameId) => {
    const loaded = await loadGameData(gameId);
    if (!loaded) return;
    const { data, log, order, scoreA, scoreB } = loaded;
    let batterIdxA = 0, batterIdxB = -1;
    for (const half of log) {
      if (half.topBottom === "表") batterIdxA += half.atBats.length;
      else batterIdxB += half.atBats.length;
    }
    batterIdxA = batterIdxA > 0 ? (batterIdxA - 1) % LINEUP_SIZE : 0;
    batterIdxB = batterIdxB >= 0 ? batterIdxB % LINEUP_SIZE : -1;
    const lastHalf = log.length > 0 ? log[log.length - 1] : null;
    setGameOrder(order);
    setResumeData({
      gameId: data.id, editMode: true,
      inning: lastHalf?.inning || 1,
      isTop: lastHalf ? lastHalf.topBottom === "表" : true,
      balls: 0, strikes: 0, outs: 0,
      runners: { ...RUNNERS_INIT },
      batterIdxA, batterIdxB, gameLog: log,
    });
    setScreen("record");
  };

  const handleResume = async (gameId) => {
    const loaded = await loadGameData(gameId);
    if (!loaded) return;
    const { data, gs, order, scoreA, scoreB, log } = loaded;
    setGameOrder(order);
    setResumeData({
      gameId: data.id,
      inning: gs.inning || 1,
      isTop: gs.isTop !== undefined ? gs.isTop : true,
      balls: gs.balls || 0, strikes: gs.strikes || 0, outs: gs.outs || 0,
      runners: migrateRunners(gs.runners, gs.runnerNames, gs.runnerNumbers),
      batterIdxA: gs.batterIdxA || 0,
      batterIdxB: gs.batterIdxB !== undefined ? gs.batterIdxB : -1,
      gameLog: log,
      currentLineupA: gs.currentLineupA || null,
      currentLineupB: gs.currentLineupB || null,
      substitutions:  gs.substitutions  || [],
      runnerPitchers:  gs.runnerPitchers  || { first: null, second: null, third: null },
    });
    setScreen("record");
  };

  const loadTeam = async () => {
    try {
      const { data } = await supabase.from("nsb_teams").select("*").limit(1);
      if (data && data.length > 0) setTeam(data[0]);
    } catch(e) {
      console.error(e);
    } finally {
      setAppLoading(false);
    }
  };

  // 初回セットアップ画面
  if (appLoading) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", background: C.bg }}>
      <div style={{ fontSize:14, color: C.textTer }}>読み込み中...</div>
    </div>
  );

  if (!team) return <TeamSetupScreen onComplete={(t) => setTeam(t)}/>;

  const tabs = [
    { id: "games",   label: "試合",  Icon: Calendar },
    { id: "players", label: "選手",  Icon: Users },
    { id: "stats",   label: "成績",  Icon: BarChart2 },
    { id: "settings",label: "設定",  Icon: Settings },
  ];

  const renderContent = () => {
    // 試合タブの画面遷移
    if (activeTab === "games") {
      if (screen === "order") return <OrderRegistration onBack={() => setScreen("home")} onNext={(order) => { setGameOrder(order); setResumeData(null); setScreen("record"); }} teamId={team.id}/>;
      if (screen === "record") return <GameRecordScreen onBack={() => { setScreen("home"); setResumeData(null); }} gameOrder={gameOrder} teamName={team.name} resumeData={resumeData}/>;
      return <GamesTab team={team} onStartOrder={() => setScreen("order")} onStartRecord={() => setScreen("record")} onResume={handleResume} onEdit={handleEdit}/>;
    }
    if (activeTab === "players") return <PlayerManagement teamId={team.id} teamName={team.name}/>;
    if (activeTab === "stats")   return <SeasonStatsTab team={team}/>;
    if (activeTab === "settings") return <SettingsScreen team={team} onUpdate={(t) => setTeam(t)}/>;
  };

  const handleTabChange = (id) => {
    if (activeTab === "games" && screen === "record") {
      setLeaveGameConfirm(id);
      return;
    }
    setActiveTab(id);
    if (id === "games") setScreen("home");
  };

  const confirmLeaveGame = () => {
    setActiveTab(leaveGameConfirm);
    setScreen("home");
    setLeaveGameConfirm(null);
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", width: "100%", fontFamily: "'Noto Sans JP', sans-serif", display: "flex", flexDirection: "column" }}>

      {/* メインコンテンツ */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", paddingBottom: 64 }}>
        {renderContent()}
      </div>

      {/* ボトムタブバー（常時表示） */}
      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, borderTop: `1px solid ${C.divider}`, display: "flex", background: C.card, boxShadow: "0 -4px 20px rgba(0,0,0,0.05)", padding: "8px 0 12px", zIndex: 100 }}>
        {tabs.map(tab => (
          <div key={tab.id} onClick={() => handleTabChange(tab.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer" }}>
            <div style={{ padding: "4px 14px", borderRadius: 50, background: activeTab === tab.id ? C.brandLight : "transparent", transition: "background 0.15s" }}>
              <tab.Icon size={20} color={activeTab === tab.id ? C.brand : C.textTer} strokeWidth={activeTab === tab.id ? 2.5 : 1.8}/>
            </div>
            <span style={{ fontSize: 10, fontWeight: activeTab === tab.id ? 700 : 400, color: activeTab === tab.id ? C.brand : C.textTer }}>{tab.label}</span>
          </div>
        ))}
      </div>

      {/* 記録画面離脱確認モーダル */}
      {leaveGameConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 24px" }}>
          <div style={{ background: C.card, borderRadius:16, padding:"24px 20px", width:"100%", maxWidth:340 }}>
            <div style={{ fontSize:15, fontWeight:700, color: C.textPri, marginBottom:8, textAlign:"center" }}>記録画面を離れますか？</div>
            <div style={{ fontSize:13, color: C.textSec, marginBottom:20, textAlign:"center" }}>保存していない記録データは失われます。</div>
            <div style={{ display:"flex", gap:10 }}>
              <div onClick={() => setLeaveGameConfirm(null)}
                style={{ flex:1, padding:"13px", borderRadius:12, background: C.bg, border:`1px solid ${C.divider}`, textAlign:"center", cursor:"pointer", fontSize:13, color: C.textSec, fontWeight:600 }}>
                キャンセル
              </div>
              <div onClick={confirmLeaveGame}
                style={{ flex:1, padding:"13px", borderRadius:12, background:"#8B2020", textAlign:"center", cursor:"pointer", fontSize:13, fontWeight:700, color:"#FFF" }}>
                離れる
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NeoScoreBookApp />);
  </script>
</body>
