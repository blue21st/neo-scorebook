function GameRecordScreen({ onBack, gameOrder, teamName }) {
  const [activeView, setActiveView] = useState("record");
  const [screen, setScreen] = useState("main");
  const [history, setHistory] = useState([]);

  // オーダーデータからactiveBattersAを構築
  const activeBattersA = (gameOrder && gameOrder.myLineup && gameOrder.myLineup.length > 0)
    ? gameOrder.myLineup
        .filter(r => r.player)
        .map(r => ({
          order: r.order,
          number: r.player.number,
          name: r.player.name,
          pos: r.pos || "-",
        }))
    : BATTERS_A;
  const activeBattersB = (gameOrder?.oppLineup?.length > 0)
    ? gameOrder.oppLineup
    : BATTERS_B;
  const oppTeamName = gameOrder?.oppTeamName || TEAM_B;
  const activeTeamA = teamName || TEAM_A;

  const [balls, setBalls] = useState(0);
  const [strikes, setStrikes] = useState(0);
  const [outs, setOuts] = useState(0);
  const [inning, setInning] = useState(1);
  const [isTop, setIsTop] = useState(true);
  const [scoreA, setScoreA] = useState(0);
  const [scoreB, setScoreB] = useState(0);
  const [batterIdxA, setBatterIdxA] = useState(0);
  const [batterIdxB, setBatterIdxB] = useState(-1);
  const [runners, setRunners] = useState({ ...RUNNERS_INIT });
  const [pitchCount, setPitchCount] = useState(0);
  const [stateHistory, setStateHistory] = useState([]); // スナップショット履歴
  const [toast, setToast] = useState(null);
  const [alert, setAlert] = useState(null);
  const toastTimer = useRef(null);

  // 進塁確認フロー
  const [pendingResult, setPendingResult] = useState(null);
  const [runnerQueue, setRunnerQueue] = useState([]);
  const [currentRunnerIdx, setCurrentRunnerIdx] = useState(0);
  const [newRunners, setNewRunners] = useState({ ...RUNNERS_INIT });
  const [runnerNames, setRunnerNames] = useState({ first: null, second: null, third: null });
  const [newRunnerNames, setNewRunnerNames] = useState({ first: null, second: null, third: null });
  const [pendingBatterBase, setPendingBatterBase] = useState(null);
  const [pendingIsOut, setPendingIsOut] = useState(false);
  const [pendingRunnerOuts, setPendingRunnerOuts] = useState(0);
  const [selectedBase, setSelectedBase] = useState(null);

  // 試合終了モーダル
  const [showEndModal, setShowEndModal] = useState(false);
  const [endStep, setEndStep] = useState("menu"); // "menu" | "cold_reason" | "confirm" | "success"
  const [endType, setEndType] = useState(null);   // "completed" | "in_progress" | "cold"
  const [coldReason, setColdReason] = useState("");
  const [saving, setSaving] = useState(false);

  // ── gameLog：経過ビューと共有するデータ ──
  const pitcherB = activeBattersB.find(b => b.pos === "投") ?? activeBattersB[8] ?? PITCHER_B;
  const getPitcherNumber = (top) => top ? pitcherB.number : (activeBattersA.find(b => b.pos === "投")?.number ?? PITCHER_A.number);

  const initHalf = (inn, top, batters, idx) => ({
    inning: inn, topBottom: top ? "表" : "裏",
    atBats: [{ ...makeBat(batters[idx % 9], getPitcherNumber(top), { first: false, second: false, third: false }) }],
  });

  const [gameLog, setGameLog] = useState([
    initHalf(1, true, activeBattersA, 0)
  ]);

  // 現在のハーフイニングと打席へのアクセサ
  const currentHalfIdx = gameLog.length - 1;
  const currentHalf = gameLog[currentHalfIdx];
  const currentAtBatIdx = currentHalf.atBats.length - 1;
  const currentAtBat = currentHalf.atBats[currentAtBatIdx];

  const batters = isTop ? activeBattersA : activeBattersB;
  const batterIdx = isTop ? batterIdxA : batterIdxB;
  const setBatterIdx = isTop ? setBatterIdxA : setBatterIdxB;
  const pitcherA = activeBattersA.find(b => b.pos === "投") ?? PITCHER_A;
  const pitcher = isTop ? pitcherB : pitcherA;
  const batter = batters[batterIdx % 9];
  const next1 = batters[(batterIdx + 1) % 9];
  const next2 = batters[(batterIdx + 2) % 9];

  const showToast = (msg) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };
  const goTo = (s) => { setHistory(h => [...h, screen]); setScreen(s); };
  const goBack = () => {
    if (!history.length) return;
    setScreen(history[history.length - 1]);
    setHistory(h => h.slice(0, -1));
  };

  // gameLog更新ヘルパー
  const updateCurrentPitches = (updater) => {
    setGameLog(log => {
      const next = log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, pitches: updater(ab.pitches) })
      });
      return next;
    });
  };

  const addEvent = (event) => {
    setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
      ...h,
      atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, events: [...ab.events, event] })
    }));
  };

  const closeCurrentAtBat = (result, runnersAfter = null) => {
    setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
      ...h,
      atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : {
        ...ab, result,
        runnersAfter: runnersAfter ?? runners,
      })
    }));
  };

  const openNextAtBat = (newIsTop, newInning, newBatters, newIdx, runnersSnapshot) => {
    const top = newIsTop ?? isTop;
    const inn = newInning ?? inning;
    const bs = newBatters ?? batters;
    const idx = newIdx ?? ((batterIdx + 1) % 9);
    const player = bs[idx];
    const snap = runnersSnapshot ?? runners;

    setGameLog(log => {
      // チェンジでハーフイニング追加
      if (newIsTop !== undefined) {
        return [...log, initHalf(inn, top, bs, idx % 9)];
      }
      // 同じハーフに打席追加
      return log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: [...h.atBats, { ...makeBat(player, getPitcherNumber(top), { ...snap }) }]
      });
    });
  };

  const addScore = (n) => {
    if (n <= 0) return;
    if (isTop) {
      const nextA = scoreA + n;
      setScoreA(nextA);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : {
          ...ab, runsScored: (ab.runsScored||0) + n,
          scoreAfterA: nextA, scoreAfterB: scoreB,
        })
      }));
    } else {
      const nextB = scoreB + n;
      setScoreB(nextB);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : {
          ...ab, runsScored: (ab.runsScored||0) + n,
          scoreAfterA: scoreA, scoreAfterB: nextB,
        })
      }));
    }
  };

  const resetAtBat = () => { setBalls(0); setStrikes(0); };

  const nextAtBat = (newIsTop, newInning, newBatters) => {
    const newIdx = newIsTop !== undefined ? 0 : (batterIdx + 1) % 9;
    setBatterIdx(newIsTop !== undefined ? (i => i) : (i => i + 1));
    resetAtBat();
    openNextAtBat(newIsTop, newInning, newBatters, newIdx);
  };

  const doOut = (runnersState, outTotal = outs + 1) => {
    const no = outTotal;
    if (no >= 3) {
      showToast("チェンジ！");
      setOuts(0);
      setRunners({ ...RUNNERS_INIT });
      const newTop = !isTop;
      const newInn = !isTop ? inning + 1 : inning;
      if (!isTop) setInning(i => i + 1);
      setIsTop(newTop);
      const newBatters = newTop ? activeBattersA : activeBattersB;
      const newIdx = newTop ? (batterIdxA + 1) % 9 : (batterIdxB + 1) % 9;
      if (newTop) setBatterIdxA(newIdx); else setBatterIdxB(newIdx);
      setBalls(0); setStrikes(0);
      setRunnerNames({ first: null, second: null, third: null });
      setGameLog(log => [...log, initHalf(newInn, newTop, newBatters, newIdx)]);
    } else {
      setOuts(no);
      if (runnersState) setRunners(runnersState);
      setBatterIdx(i => i + 1);
      resetAtBat();
      openNextAtBat(undefined, undefined, undefined);
    }
  };

  const advanceWalk = (currentRunners) => {
    const r = currentRunners ?? runners;
    const next = { ...r };
    const nextNames = { ...runnerNames };
    if (next.first && next.second && next.third) { addScore(1); nextNames.third = nextNames.second; nextNames.second = nextNames.first; }
    else if (next.first && next.second) { next.third = true; nextNames.third = nextNames.second; nextNames.second = nextNames.first; }
    else if (next.first) { next.second = true; nextNames.second = nextNames.first; }
    else next.first = true;
    nextNames.first = batter.name;
    setRunners(next);
    setRunnerNames(nextNames);
    return next;
  };

  const buildRunnerQueue = (r, names) => {
    const q = [];
    if (r.first)  q.push({ base:"first",  label:"1塁", baseNum:1, name: names?.first ?? null });
    if (r.second) q.push({ base:"second", label:"2塁", baseNum:2, name: names?.second ?? null });
    if (r.third)  q.push({ base:"third",  label:"3塁", baseNum:3, name: names?.third ?? null });
    return q;
  };

  const startRunnerFlow = (result, isOut, batterBase) => {
    if (isOut && outs >= 2) {
      showToast(result.label);
      doOut(runners);
      setScreen("main"); setHistory([]);
      return;
    }
    const queue = buildRunnerQueue(runners, runnerNames);
    setPendingResult(result);
    setPendingBatterBase(batterBase);
    setPendingIsOut(isOut);
    setNewRunners({ ...RUNNERS_INIT });
    setNewRunnerNames({ first: null, second: null, third: null });
    setPendingRunnerOuts(0);
    setCurrentRunnerIdx(0);
    setRunnerQueue(queue);
    if (queue.length === 0) {
      finishAtBat(isOut, batterBase, { ...RUNNERS_INIT }, { first: null, second: null, third: null });
      return;
    }
    if (isOut) { setScreen("askAdvance"); setHistory(h => [...h, "inplay"]); }
    else { setScreen("runnerAdvance"); setHistory(h => [...h, "inplay"]); }
  };

  const handleInplayResult = (result) => {
    // 特殊結果（死球・故意四球・振り逃げ）は専用ハンドラへ
    if (result.special === "DB")  { handlePitch("DB");  setScreen("main"); setHistory([]); return; }
    if (result.special === "IBB") { handlePitch("IBB"); setScreen("main"); setHistory([]); return; }
    if (result.special === "振")  { handlePitch("振");  return; } // 画面遷移はhandleWildStrike内で処理
    if (result.label.includes("本塁打") || result.label.includes("ホームラン")) {
      const sc = (runners.first?1:0)+(runners.second?1:0)+(runners.third?1:0)+1;
      closeCurrentAtBat(result.label, { ...RUNNERS_INIT }); // runnersAfter = 全員生還でリセット
      addScore(sc);
      setRunners({ ...RUNNERS_INIT });
      showToast("ホームラン！");
      setBatterIdx(i => i + 1); resetAtBat();
      openNextAtBat(undefined, undefined, undefined, undefined, { ...RUNNERS_INIT });
      setScreen("main"); setHistory([]); return;
    }
    closeCurrentAtBat(result.label);
    if (result.dp) {
      // 併殺打：askAdvance をスキップして直接ランナー進塁確認へ
      const queue = buildRunnerQueue(runners, runnerNames);
      setPendingResult(result); setPendingBatterBase(null); setPendingIsOut(true);
      setNewRunners({ ...RUNNERS_INIT }); setNewRunnerNames({ first: null, second: null, third: null });
      setPendingRunnerOuts(0); setCurrentRunnerIdx(0); setRunnerQueue(queue);
      if (queue.length === 0) { finishAtBat(true, null, { ...RUNNERS_INIT }, { first: null, second: null, third: null }, 0); }
      else { setScreen("runnerAdvance"); setHistory(h => [...h, "inplay"]); }
      return;
    }
    startRunnerFlow(result, result.type === "out", result.batterBase ?? null);
    setHistory(h => { const nh=[...h]; nh[nh.length-1]="inplay"; return nh; });
  };

  const handleAskAdvance = (yes) => {
    if (!yes) { finishAtBat(true, null, runners, runnerNames); setScreen("main"); setHistory([]); }
    else setScreen("runnerAdvance");
  };

  const handleRunnerAdvance = (toBase) => {
    let score = 0;
    const next = { ...newRunners };
    const nextNames = { ...newRunnerNames };
    const { name: runnerName } = runnerQueue[currentRunnerIdx];
    const runnerOut = toBase === "out" ? 1 : 0;
    if (toBase === 4) { score = 1; }
    else if (toBase !== "out") {
      if (toBase === 1) { next.first = true; nextNames.first = runnerName; }
      if (toBase === 2) { next.second = true; nextNames.second = runnerName; }
      if (toBase === 3) { next.third = true; nextNames.third = runnerName; }
    }
    addScore(score);
    const nextIdx = currentRunnerIdx + 1;
    const nextRunnerOuts = pendingRunnerOuts + runnerOut;
    if (nextIdx >= runnerQueue.length) {
      finishAtBat(pendingIsOut, pendingBatterBase, next, nextNames, nextRunnerOuts);
      setScreen("main"); setHistory([]);
    } else {
      setNewRunners(next);
      setNewRunnerNames(nextNames);
      setPendingRunnerOuts(nextRunnerOuts);
      setCurrentRunnerIdx(nextIdx);
    }
  };

  const finishAtBat = (isOut, batterBase, finalRunners, finalRunnerNames, runnerOutCount = 0) => {
    const fNames = finalRunnerNames ?? { first: null, second: null, third: null };
    if (isOut) {
      const totalOuts = outs + 1 + runnerOutCount;
      const dpLabel = runnerOutCount >= 2 ? "トリプルプレー！" : runnerOutCount === 1 ? "ゲッツー！" : (pendingResult?.label ?? "アウト");
      showToast(dpLabel);
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: finalRunners })
      }));
      setRunnerNames(fNames);
      doOut(finalRunners, totalOuts);
    } else {
      const next = { ...finalRunners };
      const nextNames = { ...fNames };
      if (batterBase === 1) {
        if (next.first) { if (next.second) { if (next.third) { addScore(1); } else { next.third = true; nextNames.third = nextNames.second; } } next.second = true; nextNames.second = nextNames.first; }
        next.first = true; nextNames.first = batter.name;
      } else if (batterBase === 2) {
        if (next.second) { if (next.third) { addScore(1); } else { next.third = true; nextNames.third = nextNames.second; } }
        next.second = true; nextNames.second = batter.name;
      } else if (batterBase === 3) {
        if (next.third) addScore(1);
        next.third = true; nextNames.third = batter.name;
      }
      showToast(pendingResult?.label ?? "出塁");
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: next })
      }));
      setRunners(next);
      setRunnerNames(nextNames);
      setBatterIdx(i => i + 1); resetAtBat();
      openNextAtBat(undefined, undefined, undefined, undefined, next);
    }
    setScreen("main");
    setHistory([]);
  };

  const handleWildStrike = () => {
    const queue = buildRunnerQueue(runners, runnerNames);
    setPendingResult({ label:"振り逃げ", type:"safe" });
    setPendingBatterBase(1); setPendingIsOut(false);
    setNewRunners({ ...RUNNERS_INIT }); setNewRunnerNames({ first: null, second: null, third: null }); setCurrentRunnerIdx(0); setRunnerQueue(queue);
    if (queue.length === 0) {
      const nextRunners = advanceWalk(runners);
      closeCurrentAtBat("振り逃げ", nextRunners);
      showToast("振り逃げ");
      setBatterIdx(i => i + 1); resetAtBat(); openNextAtBat(undefined, undefined, undefined, undefined, nextRunners);
      setScreen("main"); setHistory([]); // どの画面から呼ばれてもmainに戻る
    } else {
      closeCurrentAtBat("振り逃げ");
      setScreen("runnerAdvance"); setHistory(["main"]); // 絶対指定でhistoryをリセット
    }
  };

  // スナップショットを保存
  const saveSnapshot = () => {
    setStateHistory(h => [...h, {
      balls, strikes, outs, inning, isTop,
      scoreA, scoreB, batterIdxA, batterIdxB,
      runners: { ...runners }, runnerNames: { ...runnerNames }, pitchCount,
      gameLog: JSON.parse(JSON.stringify(gameLog)),
    }]);
  };

  // 試合保存
  const saveGame = async (status, opts = {}) => {
    setSaving(true);
    try {
      const payload = {
        team_name: activeTeamA,
        opponent: oppTeamName,
        game_date: new Date().toISOString().split("T")[0],
        status,
        score_my: scoreA,
        score_opp: scoreB,
        end_inning: opts.endInning ?? inning,
        end_reason: opts.reason || null,
        game_log: gameLog,
        game_state: status === "in_progress" ? {
          inning, isTop, balls, strikes, outs,
          runners, batterIdxA, batterIdxB, pitchCount,
          lineup: activeBattersA,
          oppTeamName, oppLineup: activeBattersB,
        } : { lineup: activeBattersA, oppTeamName, oppLineup: activeBattersB },
      };
      const { error } = await supabase.from("nsb_games").insert(payload);
      if (error) throw error;
      setEndStep("success");
    } catch (e) {
      setAlert("保存に失敗しました: " + e.message);
    } finally {
      setSaving(false);
    }
  };

  // 1球取消（スナップショット巻き戻し）
  const handleUndo = () => {
    if (stateHistory.length === 0) return;
    const prev = stateHistory[stateHistory.length - 1];
    setBalls(prev.balls);
    setStrikes(prev.strikes);
    setOuts(prev.outs);
    setInning(prev.inning);
    setIsTop(prev.isTop);
    setScoreA(prev.scoreA);
    setScoreB(prev.scoreB);
    setBatterIdxA(prev.batterIdxA);
    setBatterIdxB(prev.batterIdxB);
    setRunners(prev.runners);
    if (prev.runnerNames) setRunnerNames(prev.runnerNames);
    setPitchCount(prev.pitchCount);
    setGameLog(prev.gameLog);
    setStateHistory(h => h.slice(0, -1));
    setScreen("main");
    setHistory([]);
    showToast("1球取消しました");
  };

  const handlePitch = (type) => {
    if (type !== "IP") saveSnapshot(); // IPはhandleInplayResultで保存
    setPitchCount(c => c + 1);
    updateCurrentPitches(p => [...p, type]);
    if (type === "B") {
      const nb = balls + 1;
      if (nb >= 4) {
        const nextRunners = advanceWalk(runners);
        closeCurrentAtBat("フォアボール", nextRunners);
        showToast("フォアボール");
        setBatterIdx(i => i + 1); resetAtBat(); openNextAtBat(undefined, undefined, undefined, undefined, nextRunners);
      } else setBalls(nb);
    } else if (type === "見逃" || type === "空振") {
      const ns = strikes + 1;
      if (ns >= 3) {
        const strikeoutLabel = type === "見逃" ? "三振（K）" : "三振（KS）";
        closeCurrentAtBat(strikeoutLabel, runners);
        showToast(strikeoutLabel);
        doOut(runners);
      } else setStrikes(ns);
    } else if (type === "振") {
      handleWildStrike();
    } else if (type === "F") {
      setStrikes(s => Math.min(s + 1, 2));
    } else if (type === "IP") {
      saveSnapshot(); // インプレー画面に入る前に保存
      goTo("inplay");
    } else if (type === "DB") {
      const nextRunners = advanceWalk(runners);
      closeCurrentAtBat("デッドボール", nextRunners);
      showToast("デッドボール");
      setBatterIdx(i => i + 1); resetAtBat(); openNextAtBat(undefined, undefined, undefined, undefined, nextRunners);
    } else if (type === "IBB") {
      const nextRunners = advanceWalk(runners);
      closeCurrentAtBat("故意四球", nextRunners);
      showToast("故意四球");
      setBatterIdx(i => i + 1); resetAtBat(); openNextAtBat(undefined, undefined, undefined, undefined, nextRunners);
    }
  };

  const handleBaseClick = (base) => { setSelectedBase(base); goTo("baseAction"); };

  const handleBaseAction = (action) => {
    const base = selectedBase;
    const nb = nextBase(base);
    if (action === "盗塁成功" && nb && runners[nb]) { setAlert("前にランナーがいます"); return; }
    saveSnapshot();
    const baseLabel = base === "first" ? "1塁" : base === "second" ? "2塁" : "3塁";
    if (action === "盗塁成功") {
      addEvent(`${baseLabel}ランナー 盗塁成功`);
      const nextRunners = { ...runners, [base]: false };
      if (base === "first") nextRunners.second = true;
      else if (base === "second") nextRunners.third = true;
      else addScore(1);
      setRunners(nextRunners);
      setRunnerNames(n => {
        const nn = { ...n, [base]: null };
        if (base === "first") nn.second = n.first;
        else if (base === "second") nn.third = n.second;
        return nn;
      });
      setGameLog(log => log.map((h, hi) => hi !== currentHalfIdx ? h : {
        ...h,
        atBats: h.atBats.map((ab, ai) => ai !== currentAtBatIdx ? ab : { ...ab, runnersAfter: nextRunners })
      }));
      showToast("盗塁成功");
    } else if (action === "盗塁死" || action === "牽制アウト") {
      addEvent(`${baseLabel}ランナー ${action}`);
      const nextRunners = { ...runners, [base]: false };
      setRunners(nextRunners);
      setRunnerNames(n => ({ ...n, [base]: null }));
      showToast(action);
      doOut(nextRunners);
    } else if (action === "牽制セーフ") {
      addEvent(`${baseLabel}ランナー 牽制セーフ`); showToast("牽制セーフ");
    }
    goBack();
  };

  const canGoBack = history.length > 0;
  const currentRunner = runnerQueue[currentRunnerIdx];
  const advanceOptions = (baseNum) => {
    const opts = [];
    for (let b = baseNum; b <= 3; b++) opts.push({ label: BASE_NAMES[b], value: b });
    opts.push({ label:"ホーム（得点）", value:4 });
    opts.push({ label:"アウト（走塁死）", value:"out" });
    return opts;
  };

  // 現在の打席の投球履歴（gameLogから取得）
  const currentPitches = currentAtBat?.pitches ?? [];

  return (
    <div style={{ display:"flex", justifyContent:"center", padding:"0 0 16px", background: C.bg, minHeight:"100vh" }}>
      <div style={{ background: C.bg, borderRadius:0, padding:0, width:"100%", position:"relative" }}>

        {/* アラート */}
        {alert && (
          <div style={{ position:"absolute", inset:0, zIndex:100, display:"flex", alignItems:"center", justifyContent:"center", background:"rgba(0,0,0,0.4)", borderRadius:24 }}>
            <div style={{ background:C.card, borderRadius:12, padding:"20px 24px", width:220, textAlign:"center" }}>
              <div style={{ fontSize:14, fontWeight:600, color:C.textPri, marginBottom:16 }}>{alert}</div>
              <Btn label="OK" bg={C.brandLight} border={C.brand} color={C.brand} onClick={() => setAlert(null)}/>
            </div>
          </div>
        )}

        {/* 試合終了モーダル */}
        {showEndModal && (
          <div
            style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:200, display:"flex", alignItems:"flex-end", justifyContent:"center" }}
            onClick={() => { setShowEndModal(false); setEndStep("menu"); setColdReason(""); }}
          >
            <div
              style={{ background:C.card, borderRadius:"18px 18px 0 0", width:"100%", maxWidth:480, padding:"24px 20px 40px", boxShadow:"0 -4px 24px rgba(0,0,0,0.2)" }}
              onClick={e => e.stopPropagation()}
            >
              {/* ハンドルバー */}
              <div style={{ width:36, height:4, background:C.divider, borderRadius:2, margin:"0 auto 20px" }}/>

              {/* ── ① メニュー ── */}
              {endStep === "menu" && (<>
                <div style={{ textAlign:"center", fontSize:16, fontWeight:700, color:C.textPri, marginBottom:20 }}>記録を終了する</div>

                <div onClick={() => { setEndType("completed"); setEndStep("confirm"); }}
                  style={{ background:C.brandLight, borderRadius:14, padding:"16px 18px", marginBottom:12, cursor:"pointer", display:"flex", alignItems:"center", gap:14 }}
                >
                  <span style={{ fontSize:26 }}>✅</span>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color:C.brand }}>試合終了</div>
                    <div style={{ fontSize:12, color:C.textSec, marginTop:3 }}>最終スコアで保存して締めます</div>
                  </div>
                </div>

                <div onClick={() => { setEndType("cold"); setColdReason(""); setEndStep("cold_reason"); }}
                  style={{ background:"rgba(220,150,0,0.12)", borderRadius:14, padding:"16px 18px", marginBottom:12, cursor:"pointer", display:"flex", alignItems:"center", gap:14 }}
                >
                  <span style={{ fontSize:26 }}>⚡</span>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color:"#B07800" }}>コールド / 早期終了</div>
                    <div style={{ fontSize:12, color:C.textSec, marginTop:3 }}>規定・天候などによる途中終了</div>
                  </div>
                </div>

                <div onClick={() => { setEndType("in_progress"); setEndStep("confirm"); }}
                  style={{ background:"rgba(80,110,210,0.10)", borderRadius:14, padding:"16px 18px", marginBottom:24, cursor:"pointer", display:"flex", alignItems:"center", gap:14 }}
                >
                  <span style={{ fontSize:26 }}>🔖</span>
                  <div>
                    <div style={{ fontSize:14, fontWeight:700, color:"#4060C0" }}>中断して保存</div>
                    <div style={{ fontSize:12, color:C.textSec, marginTop:3 }}>あとで続きを入力できます</div>
                  </div>
                </div>

                <div onClick={() => { setShowEndModal(false); setEndStep("menu"); }}
                  style={{ textAlign:"center", color:C.textSec, fontSize:14, cursor:"pointer", padding:"8px 0" }}
                >キャンセル</div>
              </>)}

              {/* ── ② コールド理由選択 ── */}
              {endStep === "cold_reason" && (<>
                <div style={{ textAlign:"center", fontSize:16, fontWeight:700, color:C.textPri, marginBottom:6 }}>終了理由を選択</div>
                <div style={{ textAlign:"center", fontSize:13, color:C.textSec, marginBottom:20 }}>{inning}回{isTop?"表":"裏"}時点で終了</div>

                {["コールド", "時間切れ", "天候不良", "その他"].map(r => (
                  <div key={r} onClick={() => setColdReason(r)}
                    style={{
                      borderRadius:12, padding:"14px 16px", marginBottom:10, cursor:"pointer",
                      background: coldReason === r ? C.brandLight : C.bg,
                      border: `2px solid ${coldReason === r ? C.brand : C.divider}`,
                      display:"flex", alignItems:"center", justifyContent:"space-between",
                    }}
                  >
                    <span style={{ fontSize:14, fontWeight: coldReason===r ? 700 : 400, color: coldReason===r ? C.brand : C.textPri }}>{r}</span>
                    {coldReason === r && <span style={{ color:C.brand, fontWeight:700 }}>✓</span>}
                  </div>
                ))}

                <div style={{ display:"flex", gap:12, marginTop:16 }}>
                  <div onClick={() => { setEndStep("menu"); setColdReason(""); }}
                    style={{ flex:1, borderRadius:12, padding:"13px", background:C.bg, border:`1px solid ${C.divider}`, textAlign:"center", cursor:"pointer", fontSize:14, color:C.textSec }}
                  >戻る</div>
                  <div onClick={() => coldReason && setEndStep("confirm")}
                    style={{ flex:2, borderRadius:12, padding:"13px", background: coldReason ? C.brand : C.divider, textAlign:"center", cursor: coldReason ? "pointer" : "default", fontSize:14, fontWeight:700, color: coldReason ? C.brandText : C.textTer }}
                  >次へ</div>
                </div>
              </>)}

              {/* ── ③ 確認 ── */}
              {endStep === "confirm" && (<>
                <div style={{ textAlign:"center", fontSize:16, fontWeight:700, color:C.textPri, marginBottom:20 }}>
                  {endType === "completed" ? "試合終了" : endType === "cold" ? `コールド (${coldReason})` : "中断して保存"}
                </div>

                <div style={{ background:C.bg, borderRadius:14, padding:"20px 16px", marginBottom:16, textAlign:"center" }}>
                  <div style={{ fontSize:11, color:C.textSec, marginBottom:8, letterSpacing:"0.08em" }}>{activeTeamA} vs {oppTeamName}</div>
                  <div style={{ fontSize:36, fontWeight:900, color:C.brand, letterSpacing:"0.05em" }}>{scoreA} - {scoreB}</div>
                  <div style={{ fontSize:12, color:C.textSec, marginTop:6 }}>{inning}回{isTop?"表":"裏"}時点</div>
                </div>

                {endType === "in_progress" && (
                  <div style={{ background:"rgba(80,110,210,0.10)", borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#4060C0", textAlign:"center" }}>
                    ホーム画面から続きを入力できます
                  </div>
                )}

                <div style={{ display:"flex", gap:12 }}>
                  <div onClick={() => setEndStep(endType === "cold" ? "cold_reason" : "menu")}
                    style={{ flex:1, borderRadius:12, padding:"13px", background:C.bg, border:`1px solid ${C.divider}`, textAlign:"center", cursor:"pointer", fontSize:14, color:C.textSec }}
                  >戻る</div>
                  <div onClick={() => !saving && saveGame(endType, { reason: coldReason, endInning: inning })}
                    style={{ flex:2, borderRadius:12, padding:"13px", background: saving ? C.divider : C.brand, textAlign:"center", cursor: saving ? "default" : "pointer", fontSize:14, fontWeight:700, color:C.brandText }}
                  >{saving ? "保存中..." : "保存する"}</div>
                </div>
              </>)}

              {/* ── ④ 保存成功 ── */}
              {endStep === "success" && (<>
                <div style={{ textAlign:"center", padding:"8px 0 20px" }}>
                  <div style={{ fontSize:40, marginBottom:12 }}>🎉</div>
                  <div style={{ fontSize:16, fontWeight:700, color:C.brand, marginBottom:8 }}>保存しました</div>
                  <div style={{ fontSize:13, color:C.textSec }}>
                    {endType === "in_progress" ? "ホーム画面から続きを入力できます" : "試合データを保存しました"}
                  </div>
                </div>
                <div onClick={onBack}
                  style={{ borderRadius:12, padding:"14px", background:C.brand, textAlign:"center", cursor:"pointer", fontSize:14, fontWeight:700, color:C.brandText }}
                >ホームに戻る</div>
              </>)}
            </div>
          </div>
        )}

        <div style={{ background: C.bg, borderRadius:0 }}>

          {/* スコアバー */}
          <div style={{ background: C.scoreBg, padding:"14px 20px 16px" }}>
            <div style={{ fontSize:9, color:C.scoreSubText, textAlign:"center", letterSpacing:"0.15em", marginBottom:10, opacity:0.9, fontWeight:500 }}>NEO SCORE BOOK</div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end" }}>
              <div style={{ opacity:isTop?1:0.35, transition:"opacity 0.2s" }}>
                <div style={{ color:C.scoreSubText, fontSize:11, marginBottom:2 }}>{activeTeamA}</div>
                <div style={{ color:C.scoreText, fontSize:isTop?36:28, fontWeight:800, lineHeight:1 }}>{scoreA}</div>
              </div>
              <div style={{ textAlign:"center", paddingBottom:4 }}>
                <div style={{ color:C.scoreSubText, fontSize:12 }}>{inning}回 {isTop?"▲ 表":"▼ 裏"}</div>
              </div>
              <div style={{ textAlign:"right", opacity:isTop?0.35:1, transition:"opacity 0.2s" }}>
                <div style={{ color:C.scoreSubText, fontSize:11, marginBottom:2 }}>{oppTeamName}</div>
                <div style={{ color:C.scoreText, fontSize:isTop?28:36, fontWeight:800, lineHeight:1 }}>{scoreB}</div>
              </div>
            </div>
          </div>

          {/* ── ゲーム内サブタブ ── */}
          <div style={{ display:"flex", background: C.card, borderBottom:`1px solid ${C.divider}` }}>
            {[
              { id:"record",  label:"記録",  Icon: PenLine },
              { id:"history", label:"経過",  Icon: ScrollText },
              { id:"stats",   label:"成績",  Icon: BarChart2 },
            ].map(t => (
              <div key={t.id} onClick={() => setActiveView(t.id)} style={{
                flex:1, display:"flex", flexDirection:"column", alignItems:"center",
                gap:2, padding:"8px 4px", cursor:"pointer", userSelect:"none",
                borderBottom: activeView===t.id ? `2px solid ${C.brand}` : "2px solid transparent",
              }}>
                <t.Icon size={16} color={activeView===t.id ? C.brand : C.textTer} strokeWidth={activeView===t.id ? 2.5 : 1.8}/>
                <span style={{ fontSize:10, fontWeight: activeView===t.id ? 700 : 400, color: activeView===t.id ? C.brand : C.textTer }}>{t.label}</span>
              </div>
            ))}
          </div>

          {/* 経過ビュー */}
          {activeView === "history" && <HistoryView gameLog={gameLog} />}

          {/* 成績ビュー */}
          {activeView === "stats" && (
            <StatsView gameLog={gameLog} battersA={activeBattersA} battersB={activeBattersB} teamNameA={activeTeamA} teamNameB={oppTeamName}/>
          )}

          {activeView === "settings" && (
            <div style={{ padding:"24px 14px" }}>
              <div style={{ fontSize:13, fontWeight:700, color:C.textPri, marginBottom:16 }}>設定</div>
              <div style={{ padding:"12px 14px", background:C.bg, borderRadius:10, border:`1px solid ${C.divider}` }}>
                <div style={{ fontSize:11, color:C.textTer, marginBottom:4 }}>バージョン</div>
                <div style={{ fontSize:13, color:C.textPri }}>{APP_VERSION}</div>
              </div>
            </div>
          )}

          {/* 記録ビュー */}
          {activeView === "record" && <>

            {/* 戻るバー */}
            <div style={{ padding:"6px 14px", borderBottom:`1px solid ${C.divider}`, display:"flex", alignItems:"center", minHeight:38 }}>
              {canGoBack && (
                <div
                  onClick={goBack}
                  style={{ display:"flex", alignItems:"center", gap:2, padding:"4px 12px 4px 6px", borderRadius:20, background:C.card, border:`1px solid ${C.divider}`, cursor:"pointer", userSelect:"none", boxShadow:"0 1px 4px rgba(0,0,0,0.06)" }}
                >
                  <i className="ti ti-chevron-left" style={{ fontSize:16, color:C.textSec }} aria-hidden="true"/>
                  <span style={{ fontSize:13, color:C.textSec, fontWeight:500 }}>戻る</span>
                </div>
              )}
            </div>

            {/* メイン画面 */}
            {screen === "main" && <>

              {/* 状況エリア */}
              <div style={{ padding:"12px 20px", display:"flex", alignItems:"center", gap:12, background: C.card, boxShadow: C.cardShadow, margin:"12px 16px 0", borderRadius:20 }}>
                <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                  {[
                    { label:"B", count:balls,   max:3, color: C.bsoB },
                    { label:"S", count:strikes, max:2, color: C.bsoS },
                    { label:"O", count:outs,    max:2, color: C.bsoO },
                  ].map(r => (
                    <div key={r.label} style={{ display:"flex", alignItems:"center", gap:5 }}>
                      <span style={{ width:12, fontSize:11, fontWeight:700, color: C.textSec }}>{r.label}</span>
                      <div style={{ display:"flex", gap:4 }}>
                        {Array.from({length:r.max}).map((_,i) => <Dot key={i} filled={i<r.count} color={r.color}/>)}
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{ flex:1, display:"flex", justifyContent:"center" }}>
                  <Diamond runners={runners} onBaseClick={handleBaseClick}/>
                </div>
                <div style={{ textAlign:"right" }}>
                  <div style={{ fontSize:10, color: C.textTer, marginBottom:2 }}>ピッチャー</div>
                  <div style={{ fontSize:13, fontWeight:700, color: C.textPri }}>#{pitcher.number} {pitcher.name}</div>
                  <div style={{ marginTop:4, display:"inline-block", padding:"2px 10px", background: C.brandLight, borderRadius:20, fontSize:11, fontWeight:600, color: C.brand }}>{pitchCount}球</div>
                </div>
              </div>

              {/* 打者エリア */}
              <div style={{ padding:"12px 20px 0", margin:"12px 16px 0", background: C.card, borderRadius:20, boxShadow: C.cardShadow }}>
                <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:700, color: C.brand, background: C.brandLight, padding:"2px 10px", borderRadius:20 }}>{batter.order}番</span>
                  <span style={{ fontSize:10, color: C.textTer }}>{batter.pos}　#{batter.number}</span>
                </div>
                <div style={{ fontSize:22, fontWeight:800, color: C.textPri, lineHeight:1, marginBottom:10 }}>{batter.name}</div>

                {/* 投球履歴 */}
                <div style={{ position:"relative", paddingBottom:10, display:"flex", gap:5, flexWrap:"wrap", minHeight:30, alignItems:"center", borderTop:`1px solid ${C.divider}`, paddingTop:8 }}>
                  {currentPitches.length === 0
                    ? <span style={{ fontSize:11, color: C.textTer }}>投球なし</span>
                    : currentPitches.map((p,i) => <PitchChip key={i} type={p}/>)
                  }
                  {toast && (
                    <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background: C.brand, color: C.brandText, fontSize:13, fontWeight:600, pointerEvents:"none", borderRadius:12 }}>{toast}</div>
                  )}
                </div>
              </div>

              {/* 投球ボタン */}
              <div style={{ padding:"16px 20px 16px", margin:"12px 16px 0", background: C.card, borderRadius:20, boxShadow: C.cardShadow }}>
                <div style={{ fontSize:9, fontWeight:700, color: C.textTer, letterSpacing:"0.1em", marginBottom:16 }}>投　球</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:12 }}>
                  {[
                    { l:"-",  s:"ボール",   type:"B" },
                    { l:"○", s:"見逃しS",  type:"見逃" },
                    { l:"●", s:"空振りS",  type:"空振" },
                    { l:"v",  s:"ファウル", type:"F" },
                  ].map(b => (
                    <div key={b.l} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
                      <div
                        onClick={() => handlePitch(b.type)}
                        style={{ width:"100%", aspectRatio:"1", borderRadius:"50%", background:"#F5F7F5", border:"none", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, fontWeight:800, color: C.textPri, cursor:"pointer", userSelect:"none", boxShadow:"0 2px 8px rgba(0,0,0,0.08)", transition:"transform 0.08s, background 0.1s" }}
                        onPointerDown={e => { e.currentTarget.style.transform="scale(0.93)"; e.currentTarget.style.background=C.brandLight; }}
                        onPointerUp={e => { e.currentTarget.style.transform=""; e.currentTarget.style.background="#F5F7F5"; }}
                        onPointerLeave={e => { e.currentTarget.style.transform=""; e.currentTarget.style.background="#F5F7F5"; }}
                      >{b.l}</div>
                      <div style={{ fontSize:10, color: C.textSec, fontWeight:600, whiteSpace:"nowrap" }}>{b.s}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* 打席結果 */}
              <div style={{ padding:"12px 16px 8px" }}>
                <div style={{ fontSize:9, fontWeight:700, color: C.textTer, letterSpacing:"0.1em", marginBottom:10 }}>打席結果</div>
                <div
                  onClick={() => handlePitch("IP")}
                  style={{ padding:"16px 24px", borderRadius:50, background: C.brand, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", userSelect:"none", boxShadow:"0 4px 16px rgba(61,107,61,0.35)", transition:"transform 0.08s, box-shadow 0.08s" }}
                  onPointerDown={e => { e.currentTarget.style.transform="scale(0.97)"; e.currentTarget.style.boxShadow="none"; }}
                  onPointerUp={e => { e.currentTarget.style.transform=""; e.currentTarget.style.boxShadow="0 4px 16px rgba(61,107,61,0.35)"; }}
                  onPointerLeave={e => { e.currentTarget.style.transform=""; e.currentTarget.style.boxShadow="0 4px 16px rgba(61,107,61,0.35)"; }}
                >
                  <span style={{ fontSize:15, fontWeight:800, color: C.brandText }}>打席結果を入力</span>
                </div>
              </div>

              {/* サブ操作 */}
              <div style={{ padding:"8px 16px 16px", display:"flex", justifyContent:"center", alignItems:"center", gap:20 }}>
                <span style={{ fontSize:11, color: C.textTer, cursor:"pointer" }}>選手交代</span>
                <span
                  onClick={stateHistory.length > 0 ? handleUndo : undefined}
                  style={{
                    fontSize:11, cursor: stateHistory.length > 0 ? "pointer" : "default",
                    color: stateHistory.length > 0 ? C.textSec : C.textTer,
                    borderBottom: stateHistory.length > 0 ? `1px dashed ${C.textTer}` : "none",
                  }}
                >1球取消</span>
                <span style={{ fontSize:11, color: C.textTer, cursor:"pointer" }}>特殊処理</span>
                <span style={{ width:1, height:10, background:C.divider }}/>
                <span
                  onClick={() => { setEndStep("menu"); setShowEndModal(true); }}
                  style={{ fontSize:11, color:"#C04040", cursor:"pointer", fontWeight:600, borderBottom:"1px solid rgba(192,64,64,0.35)" }}
                >記録を終了</span>
              </div>

              {/* スコアボード */}
              <div style={{ borderTop: `1px solid ${C.divider}`, padding: "0 14px" }}>
                <div style={{ display: "flex", borderBottom: `1px solid ${C.divider}` }}>
                  <div style={{ width: 64, fontSize: 10, color: C.textTer, padding: "5px 0", flexShrink: 0 }}>チーム</div>
                  {Array.from({ length: 9 }).map((_, i) => (
                    <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10, color: i + 1 === inning ? C.brand : C.textTer, fontWeight: i + 1 === inning ? 700 : 400, padding: "5px 0" }}>{i + 1}</div>
                  ))}
                  <div style={{ width: 32, textAlign: "center", fontSize: 10, fontWeight: 700, color: C.textPri, padding: "5px 0", flexShrink: 0 }}>計</div>
                </div>
                {[
                  { name: activeTeamA, isTop: true,  score: scoreA },
                  { name: oppTeamName, isTop: false, score: scoreB },
                ].map(team => {
                  const inningScores = {};
                  gameLog.forEach(half => {
                    if ((half.topBottom === "表") !== team.isTop) return;
                    const runs = half.atBats.reduce((s, ab) => s + (ab.runsScored || 0), 0);
                    inningScores[half.inning] = (inningScores[half.inning] || 0) + runs;
                  });
                  return (
                    <div key={team.name} style={{ display: "flex", borderBottom: `1px solid ${C.divider}` }}>
                      <div style={{ width: 64, fontSize: 11, fontWeight: 600, color: C.textPri, padding: "6px 0", flexShrink: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{team.name}</div>
                      {Array.from({ length: 9 }).map((_, i) => {
                        const started = i + 1 < inning || (i + 1 === inning && (!isTop || team.isTop));
                        const isCurrent = i + 1 === inning && started;
                        const val = inningScores[i+1];
                        return (
                          <div key={i} style={{
                            flex: 1, textAlign: "center", fontSize: 12, padding: "6px 0",
                            color: val > 0 ? C.brand : isCurrent ? C.textPri : C.textTer,
                            fontWeight: val > 0 ? 700 : 400,
                          }}>
                            {val !== undefined ? val : (started ? 0 : "-")}
                          </div>
                        );
                      })}
                      <div style={{ width: 32, textAlign: "center", fontSize: 13, fontWeight: 800, color: C.textPri, padding: "6px 0", flexShrink: 0 }}>{team.score}</div>
                    </div>
                  );
                })}
              </div>
            </>}

            {/* インプレー結果 */}
            {screen === "inplay" && <InplayScreen batter={batter} onResult={handleInplayResult} onBack={goBack}/>}

            {/* 凡退時：進塁した？ */}
            {screen === "askAdvance" && <>
              <div style={{ padding:"16px 14px", borderBottom:`1px solid ${C.divider}` }}>
                <div style={{ fontSize:13, fontWeight:600, color:C.textPri, marginBottom:4 }}>{pendingResult?.label}</div>
                <div style={{ fontSize:14, color:C.textSec }}>ランナーは進塁しましたか？</div>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, padding:"14px" }}>
                <Btn label="はい"   bg={C.brandLight} border={C.brand} color={C.brand} onClick={() => handleAskAdvance(true)}/>
                <Btn label="いいえ" bg="#F1EFE8" border="#9B9A94" color="#3A3A38" onClick={() => handleAskAdvance(false)}/>
              </div>
            </>}

            {/* ランナー進塁確認 */}
            {screen === "runnerAdvance" && currentRunner && <>
              <div style={{ padding:"12px 14px", borderBottom:`1px solid ${C.divider}` }}>
                <div style={{ fontSize:11, color:C.textTer, marginBottom:4 }}>
                  {pendingResult?.dp ? "併殺打" : `${currentRunnerIdx+1} / ${runnerQueue.length}人目`}
                </div>
                <div style={{ fontSize:14, fontWeight:600, color:C.textPri }}>
                  {currentRunner.label}ランナー{currentRunner.name ? `（${currentRunner.name}）` : ""}
                </div>
                <div style={{ fontSize:13, color:C.textSec, marginTop:4 }}>
                  {pendingResult?.dp ? "アウトになった場合は「アウト」を選択" : "どこまで進みましたか？"}
                </div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:7, padding:"12px 14px" }}>
                {advanceOptions(currentRunner.baseNum).map(opt => (
                  <Btn key={opt.value} label={opt.label}
                    bg={opt.value==="out"?"#F5EAEA":opt.value===4?C.brandLight:C.bg}
                    border={opt.value==="out"?"#8B2020":opt.value===4?C.brand:C.divider}
                    color={opt.value==="out"?"#8B2020":opt.value===4?C.brand:C.textPri}
                    onClick={() => handleRunnerAdvance(opt.value)}
                  />
                ))}
              </div>
            </>}

            {/* バンク図タップ：走塁アクション */}
            {screen === "baseAction" && <>
              <div style={{ padding:"12px 14px", borderBottom:`1px solid ${C.divider}` }}>
                <div style={{ fontSize:11, color:C.textTer, marginBottom:4 }}>
                  {selectedBase==="first"?"1塁":selectedBase==="second"?"2塁":"3塁"}ランナー
                </div>
                <div style={{ fontSize:14, fontWeight:600, color:C.textPri }}>アクションを選択</div>
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:7, padding:"12px 14px" }}>
                <Btn label="盗塁成功"   bg={C.brandLight} border={C.brand} color={C.brand}
                  disabled={!!(nextBase(selectedBase) && runners[nextBase(selectedBase)])}
                  onClick={() => handleBaseAction("盗塁成功")}/>
                <Btn label="盗塁死"    bg="#F5EAEA" border="#8B2020" color="#8B2020" onClick={() => handleBaseAction("盗塁死")}/>
                <Btn label="牽制セーフ" bg="#F1EFE8" border="#9B9A94" color="#3A3A38" onClick={() => handleBaseAction("牽制セーフ")}/>
                <Btn label="牽制アウト" bg="#F5EAEA" border="#8B2020" color="#8B2020" onClick={() => handleBaseAction("牽制アウト")}/>
              </div>
            </>}

          </>}

        </div>
      </div>
    </div>
  );
}

// ホーム画面（試合タブ）

const RECENT_GAMES = [
  { id: 1, date: "6月8日",  opponent: "巨人", scoreA: 5, scoreB: 3, result: "勝" },
  { id: 2, date: "6月5日",  opponent: "中日", scoreA: 2, scoreB: 4, result: "負" },
  { id: 3, date: "6月1日",  opponent: "広島", scoreA: 7, scoreB: 2, result: "勝" },
];
const TEAM_STATS = { games: 12, wins: 8, losses: 4, winRate: ".667" };

function GamesTab({ team, onStartRecord, onStartOrder }) {
  return (
    <div style={{ flex: 1 }}>
      <div style={{ background: C.scoreBg, padding: "20px 20px 24px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div style={{ fontSize: 9, color: C.scoreSubText, letterSpacing: "0.15em", opacity: 0.8 }}>NEO SCORE BOOK</div>
          <div style={{ fontSize: 9, color: C.scoreSubText, opacity: 0.6 }}>{APP_VERSION}</div>
        </div>
        <div style={{ fontSize: 22, fontWeight: 800, color: C.scoreText, marginBottom: 2 }}>{team ? team.name : "チーム名"}</div>
        <div style={{ fontSize: 12, color: C.scoreSubText }}>{TEAM_STATS.games}試合　{TEAM_STATS.wins}勝 {TEAM_STATS.losses}敗　勝率 {TEAM_STATS.winRate}</div>
      </div>

      <div style={{ padding: "16px 16px 32px", display: "flex", flexDirection: "column", gap: 16 }}>

        {/* 試合を記録する */}
        <div onClick={onStartOrder} style={{ background: C.brand, borderRadius: 20, padding: "20px", boxShadow: "0 4px 20px rgba(61,107,61,0.35)", display: "flex", alignItems: "center", gap: 14, cursor: "pointer" }}
          onPointerDown={e => e.currentTarget.style.opacity = "0.85"}
          onPointerUp={e => e.currentTarget.style.opacity = "1"}
          onPointerLeave={e => e.currentTarget.style.opacity = "1"}
        >
          <div style={{ width: 44, height: 44, borderRadius: "50%", background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <PenLine size={22} color={C.brandText}/>
          </div>
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, color: C.brandText }}>試合を記録する</div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.7)", marginTop: 2 }}>オーダー登録 → 記録開始</div>
          </div>
          <ChevronRight size={20} color="rgba(255,255,255,0.6)" style={{ marginLeft: "auto" }}/>
        </div>

        {/* 直近の試合 */}
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.textSec, display: "flex", alignItems: "center", gap: 6 }}>
              <Calendar size={13} color={C.textSec}/>直近の試合
            </div>
          </div>
          <div style={{ background: C.card, borderRadius: 16, overflow: "hidden", boxShadow: C.cardShadow }}>
            {RECENT_GAMES.map((g, i) => (
              <div key={g.id} style={{ display: "flex", alignItems: "center", padding: "14px 16px", borderBottom: i < RECENT_GAMES.length - 1 ? `1px solid ${C.divider}` : "none" }}>
                <div style={{ width: 40, fontSize: 11, color: C.textTer, flexShrink: 0 }}>{g.date}</div>
                <div style={{ flex: 1, fontSize: 14, fontWeight: 600, color: C.textPri }}>vs {g.opponent}</div>
                <div style={{ fontSize: 15, fontWeight: 800, color: C.textPri, marginRight: 8 }}>{g.scoreA} - {g.scoreB}</div>
                <div style={{ width: 28, height: 28, borderRadius: "50%", background: g.result === "勝" ? C.brandLight : "#FEF0F0", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <span style={{ fontSize: 12, fontWeight: 800, color: g.result === "勝" ? C.brand : "#8B2020" }}>{g.result}</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        {/* チーム成績 */}
        <div>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.textSec, display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
            <TrendingUp size={13} color={C.textSec}/>チーム成績
          </div>
          <div style={{ background: C.card, borderRadius: 16, padding: "16px", boxShadow: C.cardShadow, display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 8 }}>
            {[{ label: "試合", value: TEAM_STATS.games }, { label: "勝利", value: TEAM_STATS.wins }, { label: "敗北", value: TEAM_STATS.losses }, { label: "勝率", value: TEAM_STATS.winRate }].map(s => (
              <div key={s.label} style={{ textAlign: "center" }}>
                <div style={{ fontSize: 20, fontWeight: 800, color: C.textPri }}>{s.value}</div>
                <div style={{ fontSize: 10, color: C.textTer, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────
// メインアプリ
// ─────────────────────────────
// ─────────────────────────────
// チーム初回セットアップ画面
// ─────────────────────────────
function TeamSetupScreen({ onComplete }) {
  const [teamName, setTeamName] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const handleSave = async () => {
    if (!teamName.trim()) { setError("チーム名を入力してください"); return; }
    setSaving(true);
    const { data, error } = await supabase
      .from("nsb_teams")
      .insert({ name: teamName.trim(), password_hash: "none" })
      .select()
      .single();
    if (error) { setError("保存に失敗しました"); setSaving(false); return; }
    onComplete(data);
  };

  return (
    <div style={{ background: C.bg, minHeight:"100vh", width:"100%", display:"flex", flexDirection:"column", justifyContent:"center", padding:"32px 20px", fontFamily:"'Noto Sans JP', sans-serif" }}>
      <div style={{ fontSize:9, color: C.textTer, letterSpacing:"0.15em", marginBottom:8 }}>NEO SCORE BOOK</div>
      <div style={{ fontSize:24, fontWeight:800, color: C.textPri, marginBottom:4 }}>チームを登録する</div>
      <div style={{ fontSize:13, color: C.textSec, marginBottom:32 }}>最初にチーム名を設定してください</div>

      <div style={{ background: C.card, borderRadius:16, padding:"16px", boxShadow: C.cardShadow, marginBottom:16 }}>
        <div style={{ fontSize:10, fontWeight:700, color: C.textTer, letterSpacing:"0.08em", marginBottom:8 }}>チーム名</div>
        <input
          type="text"
          placeholder="例：兵庫ライオンズ"
          value={teamName}
          onChange={e => { setTeamName(e.target.value); setError(""); }}
          style={{ width:"100%", border:"none", outline:"none", fontSize:18, fontWeight:700, color: C.textPri, background:"transparent", fontFamily:"inherit" }}
        />
        {error && <div style={{ fontSize:11, color:"#8B2020", marginTop:6 }}>{error}</div>}
      </div>

      <div
        onClick={handleSave}
        style={{ padding:"16px", borderRadius:50, background: saving ? C.textSec : C.brand, textAlign:"center", fontSize:15, fontWeight:800, color: C.brandText, cursor: saving ? "default" : "pointer", boxShadow:"0 4px 16px rgba(61,107,61,0.35)" }}
        onPointerDown={e => !saving && (e.currentTarget.style.opacity="0.8")}
        onPointerUp={e => e.currentTarget.style.opacity="1"}
        onPointerLeave={e => e.currentTarget.style.opacity="1"}
      >
        {saving ? "保存中..." : "登録して始める"}
      </div>
    </div>
  );
}

// ─────────────────────────────
// 設定画面
// ─────────────────────────────
function SettingsScreen({ team, onUpdate }) {
  const [teamName, setTeamName] = useState(team.name);
  const [saved, setSaved] = useState(false);

  const handleSave = async () => {
    await supabase.from("nsb_teams").update({ name: teamName }).eq("id", team.id);
    onUpdate({ ...team, name: teamName });
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  return (
    <div style={{ background: C.bg, minHeight:"100vh", width:"100%", fontFamily:"'Noto Sans JP', sans-serif" }}>
      <div style={{ background: C.card, padding:"16px 20px", boxShadow:"0 1px 0 #F0F0F0", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <div style={{ fontSize:18, fontWeight:800, color: C.textPri }}>設定</div>
        <span style={{ fontSize:9, color:C.textTer }}>{APP_VERSION}</span>
      </div>

      <div style={{ padding:"0 16px", display:"flex", flexDirection:"column", gap:12 }}>
        {/* チーム名 */}
        <div style={{ background: C.card, borderRadius:16, padding:"14px 16px", boxShadow: C.cardShadow }}>
          <div style={{ fontSize:10, fontWeight:700, color: C.textTer, letterSpacing:"0.08em", marginBottom:8 }}>チーム名</div>
          <input
            type="text"
            value={teamName}
            onChange={e => setTeamName(e.target.value)}
            style={{ width:"100%", border:"none", outline:"none", fontSize:16, fontWeight:700, color: C.textPri, background:"transparent", fontFamily:"inherit" }}
          />
        </div>

        <div
          onClick={handleSave}
          style={{ padding:"14px", borderRadius:50, background: saved ? C.textSec : C.brand, textAlign:"center", fontSize:14, fontWeight:800, color: C.brandText, cursor:"pointer", boxShadow:"0 4px 16px rgba(61,107,61,0.35)", transition:"background 0.2s" }}
          onPointerDown={e => e.currentTarget.style.opacity="0.8"}
          onPointerUp={e => e.currentTarget.style.opacity="1"}
          onPointerLeave={e => e.currentTarget.style.opacity="1"}
        >
          {saved ? "保存しました ✓" : "保存する"}
        </div>

        <div style={{ padding:"12px 0", textAlign:"center", fontSize:11, color: C.textTer }}>
          neo score book v0.1.0
        </div>
      </div>
    </div>
  );
}

function NeoScoreBookApp() {
  const [activeTab, setActiveTab] = useState("games");
  const [screen, setScreen] = useState("home");
  const [team, setTeam] = useState(null);
  const [appLoading, setAppLoading] = useState(true);
  const [gameOrder, setGameOrder] = useState(null);
  const [leaveGameConfirm, setLeaveGameConfirm] = useState(null); // null | tabId

  // 起動時にチーム情報を取得
  useEffect(() => {
    loadTeam();
  }, []);

  const loadTeam = async () => {
    try {
      const { data } = await supabase.from("nsb_teams").select("*").limit(1);
      if (data && data.length > 0) setTeam(data[0]);
    } catch(e) {
      console.error(e);
    } finally {
      setAppLoading(false);
    }
  };

  // 初回セットアップ画面
  if (appLoading) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", height:"100vh", background: C.bg }}>
      <div style={{ fontSize:14, color: C.textTer }}>読み込み中...</div>
    </div>
  );

  if (!team) return <TeamSetupScreen onComplete={(t) => setTeam(t)}/>;

  const tabs = [
    { id: "games",   label: "試合",  Icon: Calendar },
    { id: "players", label: "選手",  Icon: Users },
    { id: "stats",   label: "成績",  Icon: BarChart2 },
    { id: "settings",label: "設定",  Icon: Settings },
  ];

  const renderContent = () => {
    // 試合タブの画面遷移
    if (activeTab === "games") {
      if (screen === "order") return <OrderRegistration onBack={() => setScreen("home")} onNext={(order) => { setGameOrder(order); setScreen("record"); }} teamId={team.id}/>;
      if (screen === "record") return <GameRecordScreen onBack={() => setScreen("home")} gameOrder={gameOrder} teamName={team.name}/>;
      return <GamesTab team={team} onStartOrder={() => setScreen("order")} onStartRecord={() => setScreen("record")}/>;
    }
    if (activeTab === "players") return <PlayerManagement teamId={team.id} teamName={team.name}/>;
    if (activeTab === "stats")   return <PlaceholderTab label="成績"/>;
    if (activeTab === "settings") return <SettingsScreen team={team} onUpdate={(t) => setTeam(t)}/>;
  };

  const handleTabChange = (id) => {
    if (activeTab === "games" && screen === "record") {
      setLeaveGameConfirm(id);
      return;
    }
    setActiveTab(id);
    if (id === "games") setScreen("home");
  };

  const confirmLeaveGame = () => {
    setActiveTab(leaveGameConfirm);
    setScreen("home");
    setLeaveGameConfirm(null);
  };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", width: "100%", fontFamily: "'Noto Sans JP', sans-serif", display: "flex", flexDirection: "column" }}>

      {/* メインコンテンツ */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", paddingBottom: 64 }}>
        {renderContent()}
      </div>

      {/* ボトムタブバー（常時表示） */}
      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, borderTop: `1px solid ${C.divider}`, display: "flex", background: C.card, boxShadow: "0 -4px 20px rgba(0,0,0,0.05)", padding: "8px 0 12px", zIndex: 100 }}>
        {tabs.map(tab => (
          <div key={tab.id} onClick={() => handleTabChange(tab.id)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 3, cursor: "pointer" }}>
            <div style={{ padding: "4px 14px", borderRadius: 50, background: activeTab === tab.id ? C.brandLight : "transparent", transition: "background 0.15s" }}>
              <tab.Icon size={20} color={activeTab === tab.id ? C.brand : C.textTer} strokeWidth={activeTab === tab.id ? 2.5 : 1.8}/>
            </div>
            <span style={{ fontSize: 10, fontWeight: activeTab === tab.id ? 700 : 400, color: activeTab === tab.id ? C.brand : C.textTer }}>{tab.label}</span>
          </div>
        ))}
      </div>

      {/* 記録画面離脱確認モーダル */}
      {leaveGameConfirm && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.5)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 24px" }}>
          <div style={{ background: C.card, borderRadius:16, padding:"24px 20px", width:"100%", maxWidth:340 }}>
            <div style={{ fontSize:15, fontWeight:700, color: C.textPri, marginBottom:8, textAlign:"center" }}>記録画面を離れますか？</div>
            <div style={{ fontSize:13, color: C.textSec, marginBottom:20, textAlign:"center" }}>保存していない記録データは失われます。</div>
            <div style={{ display:"flex", gap:10 }}>
              <div onClick={() => setLeaveGameConfirm(null)}
                style={{ flex:1, padding:"13px", borderRadius:12, background: C.bg, border:`1px solid ${C.divider}`, textAlign:"center", cursor:"pointer", fontSize:13, color: C.textSec, fontWeight:600 }}>
                キャンセル
              </div>
              <div onClick={confirmLeaveGame}
                style={{ flex:1, padding:"13px", borderRadius:12, background:"#8B2020", textAlign:"center", cursor:"pointer", fontSize:13, fontWeight:700, color:"#FFF" }}>
                離れる
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NeoScoreBookApp />);
  </script>
</body>
</html>
